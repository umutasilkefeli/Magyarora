ir kişinin ya da yerin yanında, ona doğru ve ondan uzağa hareket bu üç ekle söylenir. Kişilerle çok kullanılır: az orvoshoz megyek (doktora gidiyorum), az orvosnál vagyok (doktordayım), az orvostól jövök (doktordan geliyorum).", "rules": ["Hol? → -nál/-nél: a barátomnál (arkadaşımda), Alinál.", "Hová? → -hoz/-hez/-höz: a fodrászhoz, Alihoz, a fához.", "Honnan? → -tól/-től: a fodrásztól, Alitól, a fától.", "-tól … -ig: reggeltől estig (sabahtan akşama).", "Zamirli biçimler: nálam, hozzám, tőlem (bkz. zamirli edatlar)."], "table": {"head": ["Kelime", "Hol? -nál/-nél", "Hová? -hoz/-hez/-höz", "Honnan? -tól/-től"], "rows": [["orvos", "orvosnál", "orvoshoz", "orvostól"], ["barát", "barátnál", "baráthoz", "baráttól"], ["fodrász", "fodrásznál", "fodrászhoz", "fodrásztól"], ["anya", "anyánál", "anyához", "anyától"], ["szék", "széknél", "székhez", "széktől"], ["bőrönd", "bőröndnél", "bőröndhöz", "bőröndtől"]]}, "ex": [["Te holnap hova mész? – Orvoshoz megyek.", "Yarın nereye gidiyorsun? – Doktora gidiyorum."], ["Én ma a barátomnál vagyok.", "Bugün arkadaşımdayım."], ["Veled együtt az anyámhoz megyünk, az anyámnál ebédelünk, az anyámtól Alihoz megyünk.", "Seninle birlikte anneme gideriz, annemde yemek yeriz, annemden Ali'ye gideriz."], ["Annál a fánál áll.", "O ağacın yanında duruyor."]], "vocab": [["orvos", "doktor"], ["fodrász", "kuaför"], ["anya", "anne"], ["barát", "arkadaş"], ["állni", "durmak"], ["várni", "beklemek"]], "read": ["Szombati körút", "Szombaton először a fodrászhoz megyek. A fodrásznál egy órát vagyok. A fodrásztól Katihoz megyek, mert nála van a könyvem. Katitól a piacra megyek, és délben anyámhoz érek. Anyámnál ebédelünk.", "Cumartesi önce kuaföre gidiyorum. Kuaförde bir saat kalıyorum. Kuaförden Kati'ye gidiyorum çünkü kitabım onda. Kati'den pazara gidiyorum ve öğlen anneme varıyorum. Annemde öğle yemeği yiyoruz."], "quiz": [["'Doktora gidiyorum': ___ megyek.", ["orvosnál", "orvoshoz", "orvostól", "orvosban"], 1, "Kişiye doğru → -hoz."], ["'Arkadaşımdayım': a ___ vagyok.", ["barátomhoz", "barátomnál", "barátomtól", "barátomban"], 1, "Hol? → -nál."], ["'Kuaförden geliyorum' hangisi?", ["fodrásztól", "fodrászból", "fodrásznál", "fodrászról"], 0, "Kişi/yer yanından → -tól."], ["'Ağacın yanında' hangisi?", ["fában", "fánál", "fához", "fán"], 1, "-nál/-nél."]], "id": 21}, {"hu": "-nak/-nek", "tr": "Verme hali (-e, -a) ve sahiplik (-nak/-nek)", "dates": ["2026-04-01", "2026-06-17", "2026-08-19", "2026-08-24"], "intro": "-nak/-nek, bir şeyin kime verildiğini gösterir (Türkçede -e/-a): Alinak adom (Ali'ye veriyorum). Ayrıca sahiplikte kullanılır: Alinak van egy autója (Ali'nin bir arabası var). Bazı fiiller hep -nak/-nek ister: telefonálni valakinek (birine telefon etmek), segíteni valakinek (birine yardım etmek).", "rules": ["Verme: Virágot adok a néninek. Ezt a tollat Alinak adom.", "Sahiplik: Alinak van egy piros autója. A néninek van 3 macskája.", "Zamirli biçim: nekem, neked, neki, nekünk, nektek, nekik.", "Fiillerle: telefonálni, segíteni, tetszik (hoşuna gitmek), kell (lazım): Nekem kell dolgozni.", "Ünlüyle biten kelimede uzama: néni → néninek, anya → anyának."], "table": {"head": ["Kelime", "-nak/-nek", "Zamir", "-nak/-nek"], "rows": [["Ali", "Alinak", "én", "nekem"], ["anya", "anyának", "te", "neked"], ["néni", "néninek", "ő", "neki"], ["barát", "barátnak", "mi", "nekünk"], ["tanár", "tanárnak", "ti", "nektek"], ["gyerek", "gyereknek", "ők", "nekik"]]}, "ex": [["Én virágot adok a néninek.", "Ben teyzeye çiçek veriyorum."], ["Alinak van egy piros autója.", "Ali'nin kırmızı bir arabası var."], ["Az autómat neked adom.", "Arabamı sana veriyorum."], ["A fodrásztól telefonálok neked.", "Kuaförden sana telefon ederim."], ["Minden este veszek nekik valamit.", "Her akşam onlara bir şey alıyorum."]], "vocab": [["adni", "vermek"], ["telefonálni vkinek", "birine telefon etmek"], ["segíteni vkinek", "birine yardım etmek"], ["tetszik", "hoşa gitmek"], ["ajándék", "hediye"], ["valami", "bir şey"]], "read": ["Ajándékok", "Jövő héten Erdemnek születésnapja van. Neki egy új könyvet veszek, mert nagyon szeret olvasni. Anyámnak virágot küldök, a szomszéd néninek pedig süteményt viszek. A barátainknak képeslapot írunk Budapestről. Nekem is tetszik ajándékot adni.", "Gelecek hafta Erdem'in doğum günü. Ona yeni bir kitap alıyorum çünkü okumayı çok seviyor. Anneme çiçek gönderiyorum, komşu teyzeye de pasta götürüyorum. Arkadaşlarımıza Budapeşte'den kartpostal yazıyoruz. Bana da hediye vermek hoş geliyor."], "quiz": [["'Ali'ye veriyorum': ___ adom.", ["Alihoz", "Alinak", "Alinál", "Alival"], 1, "Verme → -nak."], ["'Anneme' hangisi?", ["anyának", "anyánál", "anyához", "anyától"], 0, "-nak/-nek, a → á."], ["'Ona' (vermek) hangisi?", ["vele", "neki", "nála", "hozzá"], 1, "neki = ona."], ["'Ali'nin arabası var': ___ van autója.", ["Alinak", "Alinál", "Ali", "Alitól"], 0, "Sahiplik: -nak + van."]], "id": 22}, {"id": 23, "hu": "Személyragos névutók", "tr": "Zamirli edatlar: velem, nekem, nálam, hozzám, tőlem, rólam…", "dates": ["2026-03-25", "2026-04-01", "2026-04-22", "2026-06-17", "2026-07-02", "2026-07-06", "2026-07-08"], "intro": "Macarcada 'benimle, bana, bende' gibi ifadeler tek kelimedir: ek veya edat + kişi eki. Bunlar derste bir set olarak çalışıldı; en sık kullanılanlar aşağıdaki tabloda.", "rules": ["Yön üçlüsü: hova? → hozzám (bana doğru), hol? → nálam (bende / benim evimde), honnan? → tőlem (benden).", "Nekem = bana (verme) ve sahiplik: Nekem van egy autóm.", "szerintem = bence, miattam = benim yüzümden, rólam = benim hakkımda.", "Yer edatları da kişi eki alır: mellettem (yanımda), előttem, mögöttem, fölöttem, alattam.", "İsimle: Alival, Alinak, Alinál, Alihoz, Alitól, Aliról, Ali szerint, Ali miatt.", "'-deki' anlamı için araya lévő girer: az előttünk lévő ház (önümüzdeki ev), az alattunk lévő lakás (altımızdaki daire), a mögöttük lévő park (arkalarındaki park)."], "table": {"head": ["Kişi", "-val/-vel", "-nak/-nek", "-nál/-nél", "-hoz", "-tól/-től", "-ról/-ről", "szerint"], "rows": [["én", "velem", "nekem", "nálam", "hozzám", "tőlem", "rólam", "szerintem"], ["te", "veled", "neked", "nálad", "hozzád", "tőled", "rólad", "szerinted"], ["ő", "vele", "neki", "nála", "hozzá", "tőle", "róla", "szerinte"], ["mi", "velünk", "nekünk", "nálunk", "hozzánk", "tőlünk", "rólunk", "szerintünk"], ["ti", "veletek", "nektek", "nálatok", "hozzátok", "tőletek", "rólatok", "szerintetek"], ["ők", "velük", "nekik", "náluk", "hozzájuk", "tőlük", "róluk", "szerintük"]]}, "ex": [["Ma este hozzátok megyünk vacsorázni.", "Bu akşam size yemeğe geliyoruz."], ["Ma este nálatok vacsorázunk.", "Bu akşam sizde yemek yiyoruz."], ["Tőlem hozzátok megyünk, tőletek pedig velük együtt színházba megyünk.", "Benden size gideriz, sizden ise onlarla birlikte tiyatroya gideriz."], ["Ma az irodában mindenki rólad beszélt, mert nagyon jól dolgozol.", "Bugün ofiste herkes senden bahsetti çünkü çok iyi çalışıyorsun."], ["Szerinted holnap jó idő lesz?", "Sence yarın hava güzel olacak mı?"], ["Ma melletted szeretnék ülni a buszon.", "Bugün otobüste yanında oturmak istiyorum."], ["Előttünk egy nagy park van.", "Önümüzde büyük bir park var."], ["Az előttünk lévő házban egy orvos lakik.", "Önümüzdeki evde bir doktor oturuyor."], ["A mögöttük lévő parkban sétálunk.", "Arkalarındaki parkta yürüyoruz."], ["Fölöttünk egy öreg néni lakik 3 macskával.", "Üstümüzde 3 kedisiyle yaşlı bir teyze oturuyor."]], "vocab": [["szerint", "-e göre"], ["miatt", "yüzünden"], ["orvos", "doktor"], ["fodrász", "kuaför"], ["színház", "tiyatro"], ["repülőtér", "havaalanı"], ["szomszéd", "komşu"], ["vendég", "misafir"], ["adni", "vermek"], ["beszélni", "konuşmak"], ["énekelni", "şarkı söylemek"], ["akkor", "o zaman"], ["kell", "lazım, gerek"], ["tisztítani", "temizlemek"]], "read": ["Vasárnapi program", "Vasárnap reggel a fodrászhoz megyek. A fodrásztól a barátomhoz megyek, és nála ebédelünk. Ebéd után vele együtt hozzátok jövünk. Nálatok kávézunk, aztán tőletek a színházba megyünk. Szerintem nagyon jó nap lesz. Nektek is jó így?", "Pazar sabahı kuaföre gidiyorum. Kuaförden arkadaşıma gidiyorum ve onda öğle yemeği yiyoruz. Yemekten sonra onunla birlikte size geliyoruz. Sizde kahve içiyoruz, sonra sizden tiyatroya gidiyoruz. Bence çok güzel bir gün olacak. Size de böyle uygun mu?"], "quiz": [["'Bende' (benim evimde) hangisi?", ["hozzám", "nálam", "tőlem", "nekem"], 1, "Hol? → nálam."], ["'Size (doğru) gidiyoruz': ___ megyünk.", ["nálatok", "hozzátok", "tőletek", "veletek"], 1, "Hova? → hozzátok."], ["'Bence' hangisi?", ["miattam", "szerintem", "rólam", "velem"], 1, "szerintem = bence."], ["'Onun hakkında' hangisi?", ["vele", "róla", "tőle", "neki"], 1, "-ról/-ről → róla."], ["'Önümüzde' hangisi?", ["előttem", "előttünk", "előttük", "előtte"], 1, "előtt + -ünk."], ["'Önlerindeki park': a ___ park", ["előttük", "előttük lévő", "előttünk lévő", "előtte van"], 1, "-deki → lévő: az előttük lévő park."]], "table2": {"head": ["Kişi", "előtt (önünde)", "mögött (arkasında)", "mellett (yanında)", "alatt (altında)", "fölött (üstünde)", "között (arasında)"], "rows": [["én", "előttem", "mögöttem", "mellettem", "alattam", "fölöttem", "—"], ["te", "előtted", "mögötted", "melletted", "alattad", "fölötted", "—"], ["ő", "előtte", "mögötte", "mellette", "alatta", "fölötte", "—"], ["mi", "előttünk", "mögöttünk", "mellettünk", "alattunk", "fölöttünk", "közöttünk"], ["ti", "előttetek", "mögöttetek", "mellettetek", "alattatok", "fölöttetek", "közöttetek"], ["ők", "előttük", "mögöttük", "mellettük", "alattuk", "fölöttük", "közöttük"]]}, "table2_title": "Yer edatları + kişi eki (önümde, önümüzde, önlerinde…)"}, {"id": 24, "hu": "Birtokos személyragok és a 'nekem van'", "tr": "İyelik ekleri ve sahiplik ('benim … var')", "dates": ["2025-12-03", "2026-03-25", "2026-03-30", "2026-08-12", "2026-08-19", "2026-08-24"], "intro": "İyelik ekleri kime ait olduğunu gösterir: házam (evim), házad (evin), háza (evi). Zamir genelde söylenmez; ekten anlaşılır. 'Sahip olmak' fiili yoktur: Nekem van egy autóm (Benim bir arabam var).", "rules": ["én -m/-om/-em/-öm · te -d/-od/-ed/-öd · ő -a/-e/-ja/-je · mi -nk/-unk/-ünk · ti -tok/-tek/-tök · ők -uk/-ük/-juk/-jük.", "Ünlüyle biten kelimede a → á, e → é: táska → táskám, alma → almám.", "Sahiplik: nekem/neked/neki/nekünk/nektek/nekik + van + iyelikli isim. Olumsuz: Nekem nincs autóm.", "İsimle: Alinak van egy piros autója. Ali táskája (Ali'nin çantası).", "İyelikli isim + -val/-vel: barátommal, kutyámmal, autómmal.", "idő → időm, időd, ama ő için ideje (düzensiz)."], "table": {"head": ["Kişi", "ház", "könyv", "autó", "táska", "barát"], "rows": [["én", "házam", "könyvem", "autóm", "táskám", "barátom"], ["te", "házad", "könyved", "autód", "táskád", "barátod"], ["ő", "háza", "könyve", "autója", "táskája", "barátja"], ["mi", "házunk", "könyvünk", "autónk", "táskánk", "barátunk"], ["ti", "házatok", "könyvetek", "autótok", "táskátok", "barátotok"], ["ők", "házuk", "könyvük", "autójuk", "táskájuk", "barátjuk"]]}, "ex": [["Nekem van egy új telefonom.", "Benim yeni bir telefonum var."], ["Nektek van autótok?", "Sizin arabanız var mı?"], ["Nekem nincs sok időm ma.", "Bugün fazla vaktim yok."], ["Holnap a te autóddal megyünk, mert az autóm szervizben van.", "Yarın senin arabanla gidiyoruz çünkü benim arabam serviste."], ["A kutyánk neve Bodri. A kutyánk nagyon aranyos.", "Köpeğimizin adı Bodri. Köpeğimiz çok tatlı."], ["Neki nincs jogosítványa.", "Onun ehliyeti yok."]], "vocab": [["család", "aile"], ["anyuka", "anne"], ["apuka", "baba"], ["testvér", "kardeş"], ["ágy", "yatak"], ["kényelmes", "rahat"], ["aranyos", "tatlı, sevimli"], ["név / neve", "isim / adı"], ["jogosítvány", "ehliyet"], ["kedvenc", "en sevilen"], ["kolléga", "iş arkadaşı"], ["gyerek", "çocuk"], ["falu", "köy"], ["szegény", "fakir"], ["barátságos", "samimi"]], "read": ["A családom", "Ez az én családom. Az anyukám neve Anna, az apukám neve Péter. Nekünk van egy kis házunk egy faluban. A házunk nem nagy, de nagyon barátságos. A testvérem neve Lili, neki van egy macskája. Nekem nincs macskám, de van egy kutyám. A kutyámmal minden reggel sétálok.", "Bu benim ailem. Annemin adı Anna, babamın adı Péter. Bizim bir köyde küçük bir evimiz var. Evimiz büyük değil ama çok samimi. Kardeşimin adı Lili, onun bir kedisi var. Benim kedim yok ama bir köpeğim var. Köpeğimle her sabah yürüyüş yaparım."], "quiz": [["'Evimiz' hangisi?", ["házam", "házunk", "házatok", "házuk"], 1, "mi → -unk."], ["'Onun arabası' hangisi?", ["autóm", "autód", "autója", "autójuk"], 2, "ő + ünlü → -ja."], ["'Benim arabam yok' hangisi?", ["Nekem nincs autóm.", "Én nincs autó.", "Nekem nem van autóm.", "Nálam nincs autó."], 0, "nekem + nincs + iyelikli isim."], ["'Köpeğimle' hangisi?", ["kutyámval", "kutyámmal", "kutyámnál", "kutyámmel"], 1, "-m ile biten → mmal."]]}, {"id": 25, "hu": "Múlt idő", "tr": "Geçmiş zaman", "dates": ["2026-06-01", "2026-06-03", "2026-06-08", "2026-06-17", "2026-07-15", "2026-10-13"], "intro": "Geçmiş zamanın işareti -t- veya -tt-'dir. Hangi biçimin geleceği kökün son sesine bağlıdır. Kişi ekleri: -am/-em, -ál/-él, (ek yok), -unk/-ünk, -atok/-etek, -ak/-ek.", "rules": ["Çoğu fiil -t- alır: tanult, írt, ült, állt, vásárolt.", "Kökü -t ile ya da iki ünsüzle bitenler ve tek heceli bazı fiiller 3. tekilde -ott/-ett/-ött alır: olvasott, nézett, futott, főzött, úszott.", "Düzensizler: van → volt, megy → ment, jön → jött, eszik → evett (ettem), iszik → ivott (ittam), vesz → vett, tesz → tett, hisz → hitt.", "Olumsuz: nem + fiil: Nem vezettem autót, mert esett az eső."], "table": {"head": ["Kişi", "ül", "olvas", "néz", "iszik", "megy", "van"], "rows": [["én", "ültem", "olvastam", "néztem", "ittam", "mentem", "voltam"], ["te", "ültél", "olvastál", "néztél", "ittál", "mentél", "voltál"], ["ő", "ült", "olvasott", "nézett", "ivott", "ment", "volt"], ["mi", "ültünk", "olvastunk", "néztünk", "ittunk", "mentünk", "voltunk"], ["ti", "ültetek", "olvastatok", "néztetek", "ittatok", "mentetek", "voltatok"], ["ők", "ültek", "olvastak", "néztek", "ittak", "mentek", "voltak"]]}, "ex": [["Andrea az irodában dolgozott.", "Andrea ofiste çalıştı."], ["Reggel korán keltem, utána futottam a parkban.", "Sabah erken kalktım, sonra parkta koştum."], ["Ma jöttem munkába, de holnap nem jövök.", "Bugün işe geldim ama yarın gelmiyorum."], ["A tollat az asztalra tettem, de sajnos most nincs ott.", "Kalemi masaya koydum ama maalesef şimdi orada değil."], ["Ma nem mentem dolgozni, mert reggel beteg voltam.", "Bugün işe gitmedim çünkü sabah hastaydım."], ["A barátommal vásárolni mentünk, utána a moziban filmet néztünk.", "Arkadaşımla alışverişe gittik, sonra sinemada film izledik."], ["A kutya futott a labda után.", "Köpek topun peşinden koştu."]], "vocab": [["tegnap", "dün"], ["tavaly", "geçen yıl"], ["későn", "geç"], ["korán", "erken"], ["vezetni", "araba sürmek"], ["repülni", "uçmak"], ["hallgatni", "dinlemek"], ["találkozni", "buluşmak"], ["indulni", "yola çıkmak"], ["kelni", "kalkmak"], ["esik az eső", "yağmur yağıyor"], ["udvar", "avlu"], ["labda", "top"], ["focizni", "futbol oynamak"]], "read": ["Tegnap", "Tegnap korán keltem. Reggel kávét ittam a konyhában, utána busszal mentem dolgozni. Az irodában reggeltől estig dolgoztam. Este a barátommal találkoztam, egy étteremben vacsoráztunk. Otthon még olvastam egy kicsit, és tizenegykor aludtam el.", "Dün erken kalktım. Sabah mutfakta kahve içtim, sonra otobüsle işe gittim. Ofiste sabahtan akşama kadar çalıştım. Akşam arkadaşımla buluştum, bir restoranda akşam yemeği yedik. Evde biraz daha okudum ve on birde uyudum."], "quiz": [["Ő tegnap könyvet ___ (olvas).", ["olvast", "olvasott", "olvasett", "olvastam"], 1, "olvas → olvasott."], ["Mi tegnap moziba ___ (megy).", ["mentünk", "mentek", "megyünk", "menünk"], 0, "menni geçmiş: mentünk."], ["Én kávét ___ (iszik).", ["iszottam", "ittam", "ivottam", "isztam"], 1, "Düzensiz: ittam."], ["Ők otthon ___ (van).", ["voltak", "vannak", "voltunk", "volt"], 0, "van → volt, ők → voltak."]], "table2_title": "Jelen ve múlt idő yan yana (13 Ekim 2026 dersi)", "table2": {"head": ["Kişi", "látni", "", "futni", "", "vacsorázni", "", "úszni", ""], "rows": [["", "jelen", "múlt", "jelen", "múlt", "jelen", "múlt", "jelen", "múlt"], ["én", "látok", "láttam", "futok", "futottam", "vacsorázom", "vacsoráztam", "úszom", "úsztam"], ["te", "látsz", "láttál", "futsz", "futottál", "vacsorázol", "vacsoráztál", "úszol", "úsztál"], ["ő", "lát", "látott", "fut", "futott", "vacsorázik", "vacsorázott", "úszik", "úszott"], ["mi", "látunk", "láttunk", "futunk", "futottunk", "vacsorázunk", "vacsoráztunk", "úszunk", "úsztunk"], ["ti", "láttok", "láttatok", "futtok", "futottatok", "vacsoráztok", "vacsoráztatok", "úsztok", "úsztatok"], ["ők", "látnak", "láttak", "futnak", "futottak", "vacsoráznak", "vacsoráztak", "úsznak", "úsztak"]]}}, {"id": 26, "hu": "Melléknévi igenév és képzők", "tr": "Fiilden sıfat/isim: -ó/-ő, -s, -t; 'lévő'", "dates": ["2026-04-01", "2026-04-22", "2026-07-15", "2026-07-22", "2026-07-27"], "intro": "Mastardan -ni düşer ve -ó/-ő eklenir: dolgozni → dolgozó (çalışan), olvasni → olvasó (okuyan, okur). 'lévő' (olan) yer edatıyla çok kullanılır: a mellettünk lévő ház (yanımızdaki ev). İsimden sıfat ise -s ile yapılır: virág → virágos (çiçekli).", "rules": ["-ó/-ő = -an/-en (sıfat-fiil) veya meslek: tanuló, író, festő, néző, sütő (fırın).", "lenni → lévő: az asztalom előtt lévő virág (masamın önündeki çiçek).", "-s/-os/-es/-ös: virágos, kertes, csíkos, pöttyös, gyümölcsös.", "Geçmiş zaman sıfatı -t/-tt: tanult ember (okumuş kişi), főzött és sült ételek."], "table": {"head": ["Mastar", "-ó/-ő", "Anlam"], "rows": [["dolgozni", "dolgozó", "çalışan, işçi"], ["tanulni", "tanuló", "öğrenci"], ["írni", "író", "yazar"], ["olvasni", "olvasó", "okur"], ["festeni", "festő", "ressam, boyacı"], ["sütni", "sütő", "fırın"], ["lakni", "lakó", "sakin"], ["lenni", "lévő", "olan"], ["úszni", "úszó", "yüzen, yüzücü"]]}, "ex": [["A mellettünk lévő házban nem lakik senki.", "Yanımızdaki evde kimse oturmuyor."], ["A fölöttünk lakó férfi kutyája egész éjjel ugat.", "Üstümüzde oturan adamın köpeği bütün gece havlıyor."], ["A parkban egy újságot olvasó fiatal férfivel beszélgetett.", "Parkta gazete okuyan genç bir adamla sohbet etti."], ["Ma nem tudtam sütni semmit, mert a sütő rossz.", "Bugün hiçbir şey pişiremedim çünkü fırın bozuk."], ["Ez egy virágos, gyümölcsös, fás kert.", "Bu çiçekli, meyveli, ağaçlı bir bahçe."]], "vocab": [["lévő", "olan"], ["lakó", "sakin"], ["dolgozó", "çalışan"], ["olvasó", "okur"], ["festő", "ressam"], ["sütő", "fırın"], ["virágos", "çiçekli"], ["csíkos", "çizgili"], ["pöttyös", "puantiyeli"], ["könyvtár", "kütüphane"], ["rengeteg", "çok fazla"], ["ország", "ülke"], ["ugatni", "havlamak"], ["medence", "havuz"]], "read": ["A könyvtárban", "A könyvtárban minden délután sok olvasó van. A tanulók a tanulószobában tanulnak és beszélgetnek. Az ablak előtt lévő asztalnál egy idős író ül. Mellette egy fiatal festő rajzol. A könyvtár mögötti virágos kertben pedig sétáló emberek vannak.", "Kütüphanede her öğleden sonra çok okur olur. Öğrenciler çalışma odasında ders çalışıp sohbet eder. Pencerenin önündeki masada yaşlı bir yazar oturuyor. Yanında genç bir ressam çizim yapıyor. Kütüphanenin arkasındaki çiçekli bahçede ise yürüyen insanlar var."], "quiz": [["'Okur' (olvasni'den) hangisi?", ["olvasó", "olvasott", "olvasos", "olvasni"], 0, "-ni → -ó."], ["'Yanımızdaki ev': a mellettünk ___ ház.", ["levő", "lévő", "van", "lenni"], 1, "lenni → lévő."], ["'Çiçekli' hangisi?", ["virágó", "virágos", "virágtalan", "virágban"], 1, "İsim + -s."], ["'Sütő' ne demek?", ["fırıncı", "fırın", "kızarmış", "pişirmek"], 1, "sütő = fırın."]]}, {"id": 27, "hu": "Párbeszédek a hétköznapokban", "tr": "Gündelik diyaloglar: kafe, restoran, yol sorma, adres", "dates": ["2026-02-18", "2026-02-23", "2026-04-27", "2026-05-18", "2026-05-27", "2026-10-13"], "intro": "Bu derslerde hazır diyaloglarla konuşma pratiği yapıldı. Kalıpları ezberlemek en hızlı yoldur. Resmi hitapta 'ön' ve 3. tekil fiil kullanılır: Mit kér? Mit szeretne rendelni?", "rules": ["Sipariş: Kérek egy kávét tejjel, cukor nélkül. Szeretnék egy sajtos szendvicset.", "Garson: Tessék, mit kér? Itt fogyasztja, vagy elvitelre lesz?", "Hesap: Kérhetjük a számlát? Lehet kártyával fizetni?", "Yol: Hol van a bolt? – Ott, a sarkon. Messze van? – Nem, két perc gyalog.", "Adres: XIII. kerület, Kassák Lajos utca 11–13., 4. emelet 28. (13. bölge, sokak, 4. kat 28 numara); irányítószám = posta kodu.", "Uçakta: Elnézést, ez a 12A ülés? · Hová tehetem a táskámat? · Kérhetek egy pohár vizet? · Mikor érkezünk? (Tam diyalog: Okuma › A repülőn)"], "table": null, "ex": [["Jó napot kívánok! Mit szeretne rendelni?", "İyi günler! Ne sipariş etmek istersiniz?"], ["Nagy kávét kérek.", "Büyük kahve rica ediyorum."], ["Van szabad asztal két főre?", "İki kişilik boş masa var mı?"], ["Összesen kétezer-hatszáz forint lesz.", "Toplam iki bin altı yüz forint."], ["Elnézést, ez a 4-es villamos? – Igen. – A központba megy?", "Affedersiniz, bu 4 numaralı tramvay mı? – Evet. – Merkeze gidiyor mu?"], ["Hogy hívnak? – Anna vagyok. – Örülök!", "Adın ne? – Ben Anna. – Memnun oldum!"]], "vocab": [["rendelni", "sipariş etmek"], ["szendvics", "sandviç"], ["szelet", "dilim"], ["elvitelre", "paket (götürmek için)"], ["étlap", "menü"], ["számla", "hesap"], ["fizetni", "ödemek"], ["kártya", "kart"], ["sarok", "köşe"], ["közel / messze", "yakın / uzak"], ["gyalog", "yürüyerek"], ["buszmegálló", "otobüs durağı"], ["villamos", "tramvay"], ["Szívesen.", "Rica ederim."], ["Nincs mit.", "Bir şey değil."]], "read": ["Az étteremben", "– Jó estét! Van szabad asztal két főre? – Igen, erre tessék! – Megkaphatjuk az étlapot? – Természetesen. Mit szeretnének inni? – Én egy ásványvizet kérek, a férjem pedig egy limonádét. – Ételnek egy gulyáslevest és rántott sajtot kérünk. – Nagyon finom volt minden. Kérhetjük a számlát? – Persze, máris hozom.", "– İyi akşamlar! İki kişilik boş masa var mı? – Evet, buyurun bu taraftan! – Menüyü alabilir miyiz? – Elbette. Ne içmek istersiniz? – Ben bir maden suyu, eşim de bir limonata istiyor. – Yemek olarak bir gulaş çorbası ve pane peynir istiyoruz. – Her şey çok lezzetliydi. Hesabı alabilir miyiz? – Tabii, hemen getiriyorum."], "quiz": [["'Paket olsun' hangisi?", ["itt fogyasztom", "elvitelre", "számlát kérek", "tessék"], 1, "elvitelre = götürmek için."], ["'Hesabı alabilir miyiz?'", ["Kérhetjük a számlát?", "Hol van a számla?", "Fizetek kártya?", "Mennyi az idő?"], 0, "Kérhetjük a számlát?"], ["'Rica ederim' karşılığı?", ["Köszönöm", "Szívesen", "Elnézést", "Tessék"], 1, "Szívesen."], ["'Uzak mı?'", ["Közel van?", "Messze van?", "Hol van?", "Hány óra?"], 1, "messze = uzak."]]}, {"id": 28, "hu": "Mennyiség és összehasonlítás", "tr": "Miktar (sokan, hárman) ve karşılaştırma (-bb, leg-)", "dates": ["2026-09-15", "2026-09-17"], "intro": "Kişi sayısını anlatırken sayıya -an/-en eklenir: sokan (çok kişi), kevesen, hárman, többen. Karşılaştırmada sıfata -bb, enüstünlükte başına leg- ve sonuna -bb gelir; 'mint' = -den.", "rules": ["sok ember van → sokan vannak; 3 ember utazik → hárman utaznak (fiil çoğul).", "Nesne olarak: sokat, keveset, hármat, többet: Tegnap sokat dolgoztam.", "Karşılaştırma: nagy → nagyobb → legnagyobb; okos → okosabb → legokosabb; drága → drágább.", "… mint … : Péter magasabb, mint Gábor.", "Saat: 12-kor = saat 12'de; Hánykor? = Saat kaçta?"], "table": {"head": ["Sıfat", "-bb", "leg-…-bb"], "rows": [["nagy", "nagyobb", "legnagyobb"], ["okos", "okosabb", "legokosabb"], ["kedves", "kedvesebb", "legkedvesebb"], ["drága", "drágább", "legdrágább"], ["olcsó", "olcsóbb", "legolcsóbb"], ["magas", "magasabb", "legmagasabb"], ["hosszú", "hosszabb", "leghosszabb"], ["lassú", "lassabb", "leglassabb"], ["sok", "több", "legtöbb"]]}, "ex": [["Ma az iskolában sokan vannak.", "Bugün okulda çok kişi var."], ["Ma este hárman megyünk moziba.", "Bu akşam üç kişi sinemaya gidiyoruz."], ["Ma többet tanultam, mint tegnap.", "Bugün dünden daha çok çalıştım."], ["A Duna hosszabb, mint a Tisza.", "Tuna, Tisza'dan daha uzun."], ["Péter a legmagasabb a családban.", "Péter ailedeki en uzun kişi."], ["A piacon a zöldség olcsóbb, mint a boltban.", "Pazarda sebze marketten daha ucuz."]], "vocab": [["sok", "çok"], ["kevés", "az"], ["több", "daha çok"], ["legtöbb", "en çok"], ["drága", "pahalı"], ["olcsó", "ucuz"], ["lassú", "yavaş"], ["piac", "pazar yeri"], ["szálloda", "otel"], ["vonat", "tren"], ["mint", "-den (karşılaştırma)"], ["ébredni", "uyanmak"], ["felkelni", "kalkmak"]], "read": ["Két város", "Budapest nagyobb, mint Szeged, de Szeged csendesebb. Budapesten többen laknak, ezért az utcákon mindig sokan vannak. Szegeden a lakások olcsóbbak. A vonat gyorsabb, mint a busz: Budapestről Szegedre két és fél óra. Szerintem a legszebb város mégis Budapest.", "Budapeşte Szeged'den daha büyük ama Szeged daha sakin. Budapeşte'de daha çok kişi yaşıyor, bu yüzden sokaklarda hep çok insan var. Szeged'de daireler daha ucuz. Tren otobüsten daha hızlı: Budapeşte'den Szeged'e iki buçuk saat. Bence en güzel şehir yine de Budapeşte."], "quiz": [["'Üç kişi gidiyoruz': ___ megyünk.", ["Három", "Hárman", "Hármat", "Hármas"], 1, "Kişi sayısı → hárman."], ["'Nagy' kelimesinin üstünlüğü?", ["nagyabb", "nagyobb", "nagyebb", "nagyább"], 1, "nagy → nagyobb."], ["'Sok' kelimesinin karşılaştırma hali?", ["sokabb", "sokobb", "több", "legsok"], 2, "Düzensiz: sok → több."], ["Péter magasabb, ___ Gábor.", ["mint", "mert", "de", "és"], 0, "mint = -den."]]}, {"id": 29, "hu": "Kérdőszavak", "tr": "Soru kelimeleri", "dates": ["2026-10-06"], "intro": "Son derste soru kelimeleri toplu olarak verildi. Birçoğu daha önce öğrenilen eklerin soru halidir: Hol? (-ban/-on), Hová? (-ba/-ra/-hoz), Honnan? (-ból/-ról/-tól), Kivel?/Mivel? (-val/-vel), Kinek? (-nak/-nek).", "rules": ["Yer üçlüsü: Hol? (nerede) – Hová? (nereye) – Honnan? (nereden).", "Ki? (kim) → Kit? (kimi), Kinek? (kime), Kivel? (kiminle), Kiről? (kim hakkında).", "Mi? (ne) → Mit? (neyi), Mivel? (neyle), Miről? (ne hakkında).", "Hány? (kaç, sayılabilen) – Mennyi? (ne kadar, sayılamayan) – Hánykor? (saat kaçta).", "Milyen? (nasıl, ne tür) – Hogyan? (nasıl, ne şekilde) – Melyik? (hangisi)."], "table": {"head": ["Macarca", "Türkçe", "Örnek soru"], "rows": [["Ki?", "Kim?", "Ki lakik ebben a házban?"], ["Mi?", "Ne?", "Mi van az asztalon?"], ["Hol?", "Nerede?", "Hol dolgozik az apukád?"], ["Hová?", "Nereye?", "Hová mész iskola után?"], ["Honnan?", "Nereden?", "Honnan jöttél?"], ["Mikor?", "Ne zaman?", "Mikor kezdődik az óra?"], ["Miért?", "Neden?", "Miért vagy fáradt?"], ["Hogyan?", "Nasıl?", "Hogyan mész dolgozni?"], ["Milyen?", "Ne tür?", "Milyen könyvet olvasol?"], ["Melyik?", "Hangisi?", "Melyik kabát a tiéd?"], ["Mennyi?", "Ne kadar?", "Mennyi tej van a hűtőben?"], ["Hány?", "Kaç?", "Hány testvéred van?"], ["Kinek?", "Kime?", "Kinek adod ezt a virágot?"], ["Kit?", "Kimi?", "Kit vársz?"], ["Mit?", "Neyi?", "Mit főzöl vacsorára?"], ["Kivel?", "Kiminle?", "Kivel mész moziba?"], ["Mivel?", "Neyle?", "Mivel utazol Budapestre?"], ["Kiről?", "Kim hakkında?", "Kiről beszéltek?"], ["Miről?", "Ne hakkında?", "Miről szól ez a film?"]]}, "ex": [["Miért tanulsz magyarul?", "Neden Macarca öğreniyorsun?"], ["Hánykor indulsz otthonról?", "Evden saat kaçta çıkıyorsun?"], ["Melyik ételt szereted a legjobban?", "En çok hangi yemeği seviyorsun?"], ["Hol találkozol a barátaiddal?", "Arkadaşlarınla nerede buluşuyorsun?"]], "vocab": [["ki", "kim"], ["mi", "ne"], ["hol", "nerede"], ["hová", "nereye"], ["honnan", "nereden"], ["mikor", "ne zaman"], ["miért", "neden"], ["hogyan", "nasıl"], ["milyen", "ne tür"], ["melyik", "hangisi"], ["mennyi", "ne kadar"], ["hány", "kaç"], ["hűtő", "buzdolabı"], ["kabát", "mont"]], "read": ["Interjú", "– Hogy hívnak? – Umut vagyok. – Honnan jöttél? – Isztambulból. – Hol laksz most? – Budapesten, a tizenharmadik kerületben. – Mivel mész dolgozni? – Általában busszal. – Miért tanulsz magyarul? – Mert itt élek és dolgozom. – Kivel tanulsz? – Erdemmel és a tanárunkkal, Katával.", "– Adın ne? – Ben Umut. – Nereden geldin? – İstanbul'dan. – Şimdi nerede oturuyorsun? – Budapeşte'de, 13. bölgede. – İşe neyle gidiyorsun? – Genellikle otobüsle. – Neden Macarca öğreniyorsun? – Çünkü burada yaşıyorum ve çalışıyorum. – Kiminle öğreniyorsun? – Erdem'le ve öğretmenimiz Kata'yla."], "quiz": [["'Nereden?' hangisi?", ["Hol?", "Hová?", "Honnan?", "Hány?"], 2, "Honnan? = Nereden?"], ["'Kiminle?' hangisi?", ["Kinek?", "Kivel?", "Kit?", "Kiről?"], 1, "-val/-vel → Kivel?"], ["Süt için hangisi doğru?", ["Hány tej?", "Mennyi tej?", "Melyik tej?", "Hánykor tej?"], 1, "Sayılamayan → Mennyi."], ["'Neden?' hangisi?", ["Mikor?", "Miért?", "Milyen?", "Mit?"], 1, "Miért? = Neden?"]]}, {"hu": "Gyakori igék és vonzataik", "tr": "Sık kullanılan fiiller ve aldıkları ekler (söylemek, bahsetmek…)", "dates": ["2026-03-25", "2026-06-17", "2026-07-06", "2026-10-13"], "intro": "Macarcada birçok fiil belirli bir ek ister; buna 'vonzat' denir. Türkçede 'birinden bahsetmek', 'birine söylemek' dediğimiz gibi, Macarcada da 'beszélni valamiről', 'mondani valakinek' denir. Fiili ekiyle birlikte ezberlemek en kolay yoldur.", "rules": ["valamit / valakit = bir şeyi / birini (-t) · valakinek = birine (-nak/-nek) · valakivel = biriyle (-val/-vel) · valamiről = bir şey hakkında (-ról/-ről) · valamire = bir şeye (-ra/-re) · valamitől = bir şeyden (-tól/-től).", "Bahsetmek = beszélni valamiről: Miről beszéltek? – A filmről.", "Söylemek = mondani valamit valakinek: Mondd meg Alinak, hogy késem!", "Sormak = kérdezni valakit / valamit; cevap vermek = válaszolni valakinek / valamire.", "Düşünmek = gondolni valamire (bir şeyi aklına getirmek); 'bence' için gondolom / szerintem.", "Zamirlerle: beszélek veled, mondom neked, rólad beszélünk, rád gondolok, várlak téged."], "table": {"head": ["Fiil", "Türkçe", "Ek", "Örnek"], "rows": [["beszélni", "konuşmak / bahsetmek", "-val/-vel, -ról/-ről", "Beszéltem Katival a munkáról."], ["mondani", "söylemek", "-t, -nak/-nek", "Mit mondtál neki?"], ["kérdezni", "sormak", "-t", "Kérdezd meg a tanárt!"], ["válaszolni", "cevap vermek", "-nak/-nek, -ra/-re", "Nem válaszolt a kérdésre."], ["gondolni", "düşünmek", "-ra/-re", "Sokat gondolok rád."], ["emlékezni", "hatırlamak", "-ra/-re", "Emlékszel a nevére?"], ["elfelejteni", "unutmak", "-t", "Elfelejtettem a kulcsot."], ["segíteni", "yardım etmek", "-nak/-nek", "Segítek a szomszédnak."], ["telefonálni", "telefon etmek", "-nak/-nek", "Este telefonálok anyámnak."], ["hívni", "aramak, çağırmak", "-t", "Felhívlak holnap."], ["várni", "beklemek", "-t, -ra/-re", "A buszra várok."], ["találkozni", "buluşmak", "-val/-vel", "A barátommal találkozom."], ["kérni", "istemek, rica etmek", "-t, -tól/-től", "Kértem egy tollat Pétertől."], ["köszönni", "teşekkür etmek", "-t", "Köszönöm a segítséget!"], ["örülni", "sevinmek", "-nak/-nek", "Nagyon örülök neked!"], ["félni", "korkmak", "-tól/-től", "A macska fél a kutyától."], ["vigyázni", "dikkat etmek, bakmak", "-ra/-re", "Vigyázz a gyerekre!"], ["tetszik", "hoşa gitmek", "-nak/-nek", "Nekem tetszik ez a ház."], ["érteni", "anlamak", "-t", "Nem értem a kérdést."], ["hallani / látni", "duymak / görmek", "-t", "Hallottam a hírt."]]}, "ex": [["Miről beszéltetek tegnap? – A nyaralásról.", "Dün neden bahsettiniz? – Tatilden."], ["Mondd meg Erdemnek, hogy hétkor jövök!", "Erdem'e yedide geleceğimi söyle!"], ["Kérdeztem a tanárt, de nem válaszolt.", "Öğretmene sordum ama cevap vermedi."], ["Rád gondoltam, amikor ezt a dalt hallottam.", "Bu şarkıyı duyduğumda seni düşündüm."], ["Nem emlékszem a nevére, elfelejtettem.", "Adını hatırlamıyorum, unuttum."]], "vocab": [["beszélni vmiről", "bahsetmek"], ["beszélni vkivel", "biriyle konuşmak"], ["mondani vkinek", "birine söylemek"], ["kérdezni", "sormak"], ["válaszolni", "cevap vermek"], ["gondolni vmire", "düşünmek"], ["emlékezni vmire", "hatırlamak"], ["elfelejteni", "unutmak"], ["találkozni vkivel", "buluşmak"], ["várni vkire", "beklemek"], ["örülni vminek", "sevinmek"], ["félni vmitől", "korkmak"], ["vigyázni vmire", "dikkat etmek"], ["hívni / felhívni", "aramak"]], "read": ["Mit mondott?", "Tegnap beszéltem Katival. Kati mondta, hogy jövő héten Bécsbe utazik. Kérdeztem, kivel megy. Azt válaszolta, hogy a testvérével. Sokat beszéltünk a városról és a múzeumokról. Este rá gondoltam, és felhívtam, mert elfelejtettem neki mondani egy jó éttermet.", "Dün Kati'yle konuştum. Kati gelecek hafta Viyana'ya gideceğini söyledi. Kiminle gideceğini sordum. Kız kardeşiyle diye cevap verdi. Şehirden ve müzelerden çok bahsettik. Akşam onu düşündüm ve aradım çünkü ona iyi bir restoran söylemeyi unutmuştum."], "quiz": [["'Filmden bahsediyoruz': A ___ beszélünk.", ["filmet", "filmről", "filmmel", "filmnek"], 1, "beszélni vmiről → -ről."], ["'Ali'ye söyle': Mondd meg ___!", ["Alit", "Alinak", "Alival", "Aliról"], 1, "mondani vkinek → -nak."], ["'Seni düşünüyorum': ___ gondolok.", ["Téged", "Rád", "Neked", "Veled"], 1, "gondolni vmire → rád."], ["'Arkadaşımla buluşuyorum': A barátom___ találkozom.", ["-nak", "-mal", "-ról", "-t"], 1, "találkozni vkivel → barátommal."], ["'Köpekten korkuyor': Fél a ___.", ["kutyát", "kutyától", "kutyának", "kutyára"], 1, "félni vmitől → -tól."]], "id": 30}];const DL=[{"id": "asztal", "cat": "Yeme-içme", "lv": "A1", "title": "Asztalfoglalás telefonon", "tr": "Telefonla restoran rezervasyonu", "a": "Pincér", "b": "Vendég", "lines": [["a", "Jó napot kívánok, Gulyás Étterem, miben segíthetek?", "İyi günler, Gulyás Restoranı, nasıl yardımcı olabilirim?"], ["b", "Jó napot! Szeretnék asztalt foglalni péntek estére.", "İyi günler! Cuma akşamı için masa ayırtmak istiyorum."], ["a", "Hány főre?", "Kaç kişilik?"], ["b", "Négy főre, kérem.", "Dört kişilik, lütfen."], ["a", "Hány órára?", "Saat kaça?"], ["b", "Hét órára. Van szabad asztal?", "Saat yediye. Boş masa var mı?"], ["a", "Hétkor sajnos nincs, de fél nyolckor van.", "Yedide maalesef yok ama yedi buçukta var."], ["b", "Rendben, akkor fél nyolcra kérem.", "Tamam, o zaman yedi buçuğa lütfen."], ["a", "Milyen névre foglalhatom?", "Hangi isme ayırayım?"], ["b", "Asilkefeli névre. A-s-i-l-k-e-f-e-l-i.", "Asilkefeli adına. A-s-i-l-k-e-f-e-l-i."], ["a", "Megadná a telefonszámát is?", "Telefon numaranızı da verir misiniz?"], ["b", "Persze: 06 30 123 4567. Lehet az ablak mellé kérni?", "Tabii: 06 30 123 4567. Pencere kenarı rica edebilir miyim?"], ["a", "Igen, felírtam. Péntek, fél nyolc, négy fő, ablak mellett.", "Evet, not ettim. Cuma, yedi buçuk, dört kişi, pencere kenarı."], ["b", "Köszönöm szépen, viszonthallásra!", "Çok teşekkürler, görüşmek üzere!"]], "key": [["Szeretnék asztalt foglalni …", "… için masa ayırtmak istiyorum"], ["Hány főre?", "Kaç kişilik?"], ["Hány órára?", "Saat kaça?"], ["Milyen névre?", "Hangi isme?"], ["Viszonthallásra!", "(Telefonda) Görüşmek üzere!"]]}, {"id": "rendeles", "cat": "Yeme-içme", "lv": "A1", "title": "Rendelés az étteremben", "tr": "Restoranda sipariş", "a": "Pincér", "b": "Vendég", "lines": [["a", "Jó estét! Itt az étlap. Mit hozhatok inni?", "İyi akşamlar! Menü burada. Ne içmek istersiniz?"], ["b", "Egy pohár vörösbort és egy ásványvizet kérek.", "Bir kadeh kırmızı şarap ve bir maden suyu istiyorum."], ["a", "Választottak már ételt?", "Yemek seçtiniz mi?"], ["b", "Még nem. Mit ajánl?", "Henüz değil. Ne önerirsiniz?"], ["a", "A halászlé és a csirkepaprikás nagyon finom ma.", "Bugün balık çorbası ve tavuk paprikaş çok lezzetli."], ["b", "Akkor egy csirkepaprikást kérek galuskával.", "O zaman galuskalı bir tavuk paprikaş alayım."], ["a", "Előételt vagy levest kér?", "Başlangıç ya da çorba ister misiniz?"], ["b", "Igen, egy gulyáslevest is kérek. Nem túl csípős?", "Evet, bir de gulaş çorbası alayım. Çok acı değil mi?"], ["a", "Nem, csak egy kicsit. Desszertet később kérnek?", "Hayır, sadece biraz. Tatlıyı sonra mı istersiniz?"], ["b", "Igen, majd később. Köszönöm.", "Evet, sonra. Teşekkürler."], ["a", "Ízlett?", "Beğendiniz mi?"], ["b", "Nagyon finom volt! Kérhetem a számlát? Kártyával fizetek.", "Çok lezzetliydi! Hesabı alabilir miyim? Kartla ödeyeceğim."]], "key": [["Mit ajánl?", "Ne önerirsiniz?"], ["… kérek", "… istiyorum"], ["Nem túl csípős?", "Çok acı değil mi?"], ["Ízlett?", "Beğendiniz mi?"], ["Kérhetem a számlát?", "Hesabı alabilir miyim?"]]}, {"id": "kave", "cat": "Yeme-içme", "lv": "A1", "title": "A kávézóban", "tr": "Kafede sipariş", "a": "Eladó", "b": "Vendég", "lines": [["a", "Szia! Mit adhatok?", "Merhaba! Ne vereyim?"], ["b", "Szia! Egy nagy cappuccinót kérek zabtejjel.", "Merhaba! Yulaf sütlü büyük bir cappuccino istiyorum."], ["a", "Itt fogyasztod vagy elviszed?", "Burada mı içeceksin, götürecek misin?"], ["b", "Elviszem. És van valami sós sütemény?", "Götüreceğim. Tuzlu bir şey var mı?"], ["a", "Van sajtos pogácsa és sonkás croissant.", "Peynirli poğaça ve jambonlu kruvasan var."], ["b", "Két pogácsát kérek. Mennyi lesz?", "İki poğaça alayım. Ne kadar tutar?"], ["a", "Összesen kétezer-kétszáz forint.", "Toplam iki bin iki yüz forint."], ["b", "Tessék, telefonnal fizetek.", "Buyurun, telefonla ödüyorum."], ["a", "Köszönöm! Szép napot!", "Teşekkürler! İyi günler!"]], "key": [["Mit adhatok?", "Ne vereyim?"], ["Itt fogyasztod vagy elviszed?", "Burada mı, götürecek misin?"], ["Mennyi lesz?", "Ne kadar tutar?"], ["Szép napot!", "İyi günler!"]]}, {"id": "szalloda", "cat": "Seyahat", "lv": "A2", "title": "Szállodai szobafoglalás", "tr": "Otel rezervasyonu", "a": "Recepciós", "b": "Vendég", "lines": [["a", "Hotel Duna, jó napot kívánok!", "Hotel Duna, iyi günler!"], ["b", "Jó napot! Szeretnék egy kétágyas szobát foglalni november tizenötödikétől tizenhetedikéig.", "İyi günler! 15–17 Kasım arası iki kişilik bir oda ayırtmak istiyorum."], ["a", "Két éjszakára, ugye? Egy pillanat… Igen, van szabad szobánk.", "İki gece, değil mi? Bir saniye… Evet, boş odamız var."], ["b", "Mennyibe kerül egy éjszaka?", "Bir gecesi ne kadar?"], ["a", "Harmincötezer forint, reggelivel együtt.", "Kahvaltı dahil otuz beş bin forint."], ["b", "A szobában van erkély?", "Odada balkon var mı?"], ["a", "Igen, és a Dunára néz.", "Evet, ve Tuna'ya bakıyor."], ["b", "Nagyszerű! Van parkolási lehetőség?", "Harika! Park yeri var mı?"], ["a", "Van garázsunk, ötezer forint naponta.", "Garajımız var, günlüğü beş bin forint."], ["b", "Rendben, akkor foglalok. Hánykor lehet bejelentkezni?", "Tamam, o zaman ayırtıyorum. Saat kaçta giriş yapılabiliyor?"], ["a", "Délután kettőtől. Kijelentkezés délelőtt tizenegyig.", "Öğleden sonra ikiden itibaren. Çıkış öğleden önce on bire kadar."], ["b", "Köszönöm, e-mailben kérek visszaigazolást.", "Teşekkürler, e-postayla onay rica ediyorum."]], "key": [["kétágyas szoba", "iki kişilik oda"], ["… -tól … -ig", "… -den … -e kadar"], ["reggelivel együtt", "kahvaltı dahil"], ["bejelentkezni / kijelentkezni", "giriş / çıkış yapmak"], ["visszaigazolás", "onay"]]}, {"id": "orvos", "cat": "Sağlık", "lv": "A2", "title": "Időpont az orvosnál", "tr": "Doktordan randevu", "a": "Asszisztens", "b": "Beteg", "lines": [["a", "Dr. Kovács rendelője, tessék!", "Dr. Kovács muayenehanesi, buyurun!"], ["b", "Jó napot! Szeretnék időpontot kérni a doktor úrhoz.", "İyi günler! Doktor beyden randevu almak istiyorum."], ["a", "Mi a panasza?", "Şikâyetiniz nedir?"], ["b", "Három napja fáj a torkom és lázas vagyok.", "Üç gündür boğazım ağrıyor ve ateşim var."], ["a", "Holnap reggel kilenckor jó lenne?", "Yarın sabah dokuzda uygun olur mu?"], ["b", "Sajnos akkor dolgozom. Délután nincs időpont?", "Maalesef o saatte çalışıyorum. Öğleden sonra randevu yok mu?"], ["a", "Négy órára tudok adni.", "Saat dörde verebilirim."], ["b", "Az nagyon jó, köszönöm.", "O çok iyi, teşekkürler."], ["a", "Kérem, hozza magával a TAJ-kártyáját!", "Lütfen sağlık kartınızı (TAJ) yanınızda getirin!"], ["b", "Rendben. Viszonthallásra!", "Tamam. Görüşmek üzere!"]], "key": [["időpontot kérni", "randevu almak"], ["Mi a panasza?", "Şikâyetiniz nedir?"], ["Fáj a torkom.", "Boğazım ağrıyor."], ["lázas vagyok", "ateşim var"], ["TAJ-kártya", "sağlık sigortası kartı"]]}, {"id": "patika", "cat": "Sağlık", "lv": "A1", "title": "A gyógyszertárban", "tr": "Eczanede", "a": "Gyógyszerész", "b": "Vásárló", "lines": [["a", "Jó napot! Miben segíthetek?", "İyi günler! Nasıl yardımcı olabilirim?"], ["b", "Jó napot! Fáj a fejem, és náthás vagyok. Mit ajánl?", "İyi günler! Başım ağrıyor ve nezleyim. Ne önerirsiniz?"], ["a", "Ez a fájdalomcsillapító jó. Naponta háromszor egy tablettát vegyen be.", "Bu ağrı kesici iyi. Günde üç kez bir tablet alın."], ["b", "Étkezés előtt vagy után?", "Yemekten önce mi sonra mı?"], ["a", "Étkezés után. És itt van egy orrspray is.", "Yemekten sonra. Bir de burun spreyi var."], ["b", "Kérem mindkettőt. Recept kell?", "İkisini de alayım. Reçete gerekiyor mu?"], ["a", "Nem, recept nélkül kapható. Háromezer-négyszáz forint lesz.", "Hayır, reçetesiz alınabiliyor. Üç bin dört yüz forint."], ["b", "Tessék. Köszönöm a segítséget!", "Buyurun. Yardımınız için teşekkürler!"], ["a", "Szívesen! Jobbulást!", "Rica ederim! Geçmiş olsun!"]], "key": [["Fáj a fejem.", "Başım ağrıyor."], ["naponta háromszor", "günde üç kez"], ["étkezés után", "yemekten sonra"], ["recept nélkül", "reçetesiz"], ["Jobbulást!", "Geçmiş olsun!"]]}, {"id": "piac2", "cat": "Alışveriş", "lv": "A1", "title": "A piacon", "tr": "Pazarda", "a": "Árus", "b": "Vásárló", "lines": [["a", "Tessék, mit adhatok?", "Buyurun, ne vereyim?"], ["b", "Mennyibe kerül a paradicsom?", "Domates ne kadar?"], ["a", "Kilója nyolcszáz forint. Nagyon friss, ma reggel szedtük.", "Kilosu sekiz yüz forint. Çok taze, bu sabah topladık."], ["b", "Akkor kérek egy kilót. És fél kiló paprikát is.", "O zaman bir kilo alayım. Bir de yarım kilo biber."], ["a", "Erőset vagy édeset?", "Acı mı tatlı mı?"], ["b", "Édeset, kérem. Van tojása is?", "Tatlı, lütfen. Yumurtanız da var mı?"], ["a", "Van, tíz darab hétszáz forint.", "Var, on tanesi yedi yüz forint."], ["b", "Tíz tojást is kérek. Ennyi lesz, köszönöm.", "On yumurta da alayım. Bu kadar, teşekkürler."], ["a", "Összesen kétezer-kilencszáz. Van szatyra?", "Toplam iki bin dokuz yüz. Poşetiniz var mı?"], ["b", "Igen, van. Tessék, háromezer, a többi a magáé.",
