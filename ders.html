.rich .w{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,6vw,34px)}.rich .tro{color:var(--muted)}
.rback{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.rback .bh{font-family:var(--f-display);font-weight:700;font-size:18px}.rback .tro,.rback .tr{color:var(--muted);font-weight:400;font-size:14px}
.rback table.t{width:100%;border-collapse:collapse}.rback table.t td,.rback table.t th{padding:5px 8px;border-bottom:1px solid var(--line)}
.rback td.p{color:var(--muted);width:3.5em}.rback .e{color:var(--red);font-weight:600}.rback .note{color:var(--muted);font-size:13px}
.rback tr.hit td{background:var(--accent-soft)}.swatch{width:64px;height:40px;border-radius:8px;border:1px solid var(--line)}
.tsetup{display:grid;gap:12px;max-width:560px}.twrong{border-top:1px solid var(--line);padding:8px 0}.opt .pers,.qq .pers{color:var(--accent);font-weight:600}

.ghelp{margin-top:18px}

<title>Magyar Óra Füzeti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: schoolbook archive — lesson index rail on the left, the lesson page on the right; collapses to a lesson picker on phones */
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#1d2621; --muted:#5f6d65; --line:#d9e0db;
  --accent:#23664a; --accent-soft:#e1efe7; --red:#b4363a; --hl:#fff0b8;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --muted:#97a69d; --line:#2c3832;
  --accent:#6cc79d; --accent-soft:#1f3a2d; --red:#e57b7e; --hl:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --muted:#97a69d; --line:#2c3832;
  --accent:#6cc79d; --accent-soft:#1f3a2d; --red:#e57b7e; --hl:#5a4d12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:0;letter-spacing:-.02em}
h1 .fl{display:inline-flex;gap:3px;vertical-align:middle;margin-left:10px}
h1 .fl i{display:block;width:8px;height:22px;border-radius:2px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.stats{display:flex;gap:20px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:700}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px}
.tabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;font-family:var(--f-display);font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
.tabs button:focus-visible,.chip:focus-visible,.lesson:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.mon{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.lesson{display:flex;justify-content:space-between;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:5px 10px;border-radius:6px;cursor:pointer;text-align:left}
.lesson:hover{background:var(--accent-soft)}
.lesson[aria-current="true"]{background:var(--accent);color:var(--paper)}
.lesson span{font-family:var(--f-mono);font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#pick{display:none;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
main{min-width:0}
.lhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:4px 0 14px}
.lhead h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.lhead .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav2{display:flex;gap:8px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.msg{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:10px 20px;border-bottom:1px dashed var(--line)}
.msg:last-child{border-bottom:0}
.msg time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.txt .q{display:block;color:var(--muted);font-size:13px}
.who{font-family:var(--f-mono);font-size:11px;color:var(--red);display:block}
.msg.o{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.img{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.res-day{font-family:var(--f-display);font-weight:700;font-size:15px;padding:12px 20px 2px;color:var(--accent);cursor:pointer;display:block;border:0;background:none;text-align:left}
.empty{padding:28px 20px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
td,th{padding:7px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td:first-child{font-weight:600}
td.d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
td.d button{all:unset;cursor:pointer;color:var(--accent)}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  nav.rail{display:none}
  #pick{display:block}
  .msg{grid-template-columns:44px minmax(0,1fr);padding:10px 14px;gap:10px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.mainnav{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.mainnav button{all:unset;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:15px;padding:8px 14px;border-radius:8px;color:var(--muted)}
.mainnav button:hover{color:var(--ink);background:var(--accent-soft)}
.mainnav button[aria-current="true"]{color:var(--paper);background:var(--ink)}
.mainnav button:focus-visible,.btn:focus-visible,.opt:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-top:18px}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:26px}
.toc a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.toc a:hover{border-color:var(--accent)}
.toc .n,.unum{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.toc b{font-family:var(--f-display);font-weight:500;font-size:14px;display:block;line-height:1.25}
.toc small{color:var(--muted);font-size:12.5px}
.unit{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:18px;scroll-margin-top:16px}
.unit h3{font-family:var(--f-display);font-weight:700;font-size:24px;margin:2px 0 0;text-wrap:balance;line-height:1.15}
.unit .trt{color:var(--muted);margin:2px 0 12px;font-size:15px}
.unit p.intro{max-width:68ch;margin:0 0 12px}
.unit h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
.unit ul.rules{margin:0;padding-left:20px;max-width:72ch}
.unit ul.rules li{margin:3px 0}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 20px;margin:0}
.ex dt{font-weight:600}.ex dd{margin:0;color:var(--muted)}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dates button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.unitbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
select.us{width:auto;max-width:min(360px,100%);font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}
.btn{all:unset;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.reading{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.reading h3{font-family:var(--f-display);font-size:22px;margin:0 0 2px}
.reading .src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.reading .hu{font-size:17px;line-height:1.75;max-width:66ch;margin:12px 0}
.reading .hu span.w{border-bottom:1px dotted var(--muted);cursor:help}
.reading .tr{color:var(--muted);max-width:66ch;border-left:3px solid var(--accent-soft);padding-left:12px;margin:10px 0 0}
.deck{display:grid;place-items:center;gap:14px;padding:12px 0}
.card{all:unset;cursor:pointer;width:min(440px,100%);aspect-ratio:3/2;max-width:100%;perspective:1000px;display:block}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;padding:20px;text-align:center}
.card .f{background:var(--paper)}
.card .b{background:var(--accent);color:var(--paper);transform:rotateY(180deg)}
.card .w{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,6vw,36px);line-height:1.15;overflow-wrap:anywhere}
.card .hint{position:absolute;bottom:10px;left:0;right:0;font-family:var(--f-mono);font-size:11px;opacity:.6}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 24px;max-width:680px}
.quiz .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.quiz .qq{font-family:var(--f-display);font-weight:500;font-size:20px;margin:6px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--red);color:var(--red)}
.why{margin-top:12px;color:var(--muted)}
.score{font-family:var(--f-display);font-size:40px;font-weight:700}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
@media (max-width:760px){.unit,.reading,.quiz{padding:16px}.ex{grid-template-columns:minmax(0,1fr)}.ex dd{margin-bottom:6px}}
.conv{margin:10px 0 0;padding-left:22px;display:grid;gap:6px;max-width:70ch}.conv .cq{all:unset;cursor:pointer;font-size:16px}.conv .cq:hover{color:var(--accent)}.conv .cq:focus-visible{outline:2px solid var(--accent)}.conv .tr{display:block;color:var(--muted);font-size:14px}
.unitnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}.unitnav .sp{flex:1}
.dlg{display:grid;gap:10px;margin:8px 0 6px}
.dl{display:grid;gap:2px;max-width:85%}.dl.b{justify-self:end;text-align:right}
.dl .who{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dl .bub{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 13px;display:grid;gap:3px}
.dl.b .bub{background:var(--accent-soft);border-color:transparent}
.dl .hu{font-size:16px}.dl .tr{color:var(--muted);font-size:13.5px}
.reveal{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--accent);text-decoration:underline}
.kh{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:500}
@media (max-width:760px){.dl{max-width:95%}}
.piles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 6px}
.pile{all:unset;cursor:pointer;display:grid;gap:2px;text-align:center;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.pile b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}.pile span{font-size:12px;color:var(--muted)}
.pile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pile.no b{color:var(--red)}.pile.later b{color:#b07a12}.pile.yes b{color:var(--accent)}
.pile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rate .btn{display:grid;gap:1px;text-align:center;min-width:104px}.rate .btn small{font-family:var(--f-mono);font-size:10.5px;opacity:.75}
.r-no{border-color:var(--red);color:var(--red)}.r-later{border-color:#b07a12;color:#b07a12}.r-yes{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid currentColor}
.tag.no{color:var(--red)}.tag.later{color:#b07a12}.tag.yes{color:var(--accent)}
@media (max-width:420px){.rate .btn{min-width:0;flex:1;padding:8px 6px}}
.embedv .mainnav{display:none}.embedv section.view{padding-top:4px}
</style>
</head><body><div class="wrap"><a class="back" href="./">← Magyar Füzet</a>

  <header class="top">
    <div>
      <h1>Magyar Óra Füzeti<span class="fl" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--line)"></i><i style="background:var(--accent)"></i></span></h1>
      <p class="sub">Umut &amp; Erdem'in Macarca ders notları — konu akışı, okumalar, kartlar, testler ve ders kitapçığı.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header><nav class="mainnav" aria-label="Bölümler"><button data-v="akis">Konu akışı</button><button data-v="konus">Günlük konuşmalar</button><button data-v="oku">Okumalar</button><button data-v="kart">Kelime kartları</button><button data-v="test">Test</button><button data-v="arsiv">Arşiv</button></nav><section class="view" id="v-akis"></section><section class="view" id="v-konus" hidden></section><section class="view" id="v-oku" hidden></section><section class="view" id="v-kart" hidden></section><section class="view" id="v-test" hidden></section><section class="view" id="v-arsiv" hidden>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-ders" aria-selected="true">Dersler</button>
      <button role="tab" id="t-cift" aria-selected="false">Kelime çiftleri</button>
    </div>
    <input id="q" type="search" placeholder="Ara: macska, -ni, holnap…" aria-label="Tüm derslerde ara">
    <button class="chip" id="onlyL" aria-pressed="false" hidden>.</button>
  </div>
  <div class="grid">
    <nav class="rail" id="rail" aria-label="Dersler"></nav>
    <main>
      <select id="pick" aria-label="Ders seç"></select>
      <div id="view"></div>
    </main>

edig vacsorázni megyünk."], ["L", "2026-01-28T18:36", "Holnap reggel szeretnék veled menni az irodába,  mert az én autóm, sajnos rossz."], ["L", "2026-01-28T18:38", "Vasárnap szeretnék veled együtt főzni egy jó ebédet,  ezért ma munka után szeretnék veled vásárolni menni."], ["L", "2026-01-28T18:39", "Együtt/ birlikte"], ["L", "2026-01-28T18:43", "Januártól  márciusig hideg van, de március után már nincs nagyon hideg."], ["L", "2026-01-28T18:44", "Már/ artık"], ["L", "2026-01-28T18:44", "Ma tudok veletek jönni sportolni?"], ["L", "2026-01-28T18:46", "Ma tudunk menni együtt vásárolni munka után?"], ["L", "2026-01-28T18:48", "Holnaptól 1 hétig nem leszek az irodában,  mert a férjemmel Londonba, utazunk."], ["L", "2026-01-28T18:49", "Utazni/ seyahat etmek"], ["L", "2026-02-04T18:18", "Ma önnel jövök ebédelni"], ["L", "2026-02-04T18:19", "Ma délben önökkel jövök, ebédelni."], ["L", "2026-02-04T18:20", "Ma ön otthon van, vagy az irodában?"], ["L", "2026-02-04T18:21", "Ma önnel jövök a munkába,  mert az én autóm, sajnos rossz."], ["L", "2026-02-04T18:22", "Önök holnap otthon lesznek vagy dolgoznak?"], ["L", "2026-02-04T18:24", "Ma szeretnék önnel teniszezni, ha jó idő lesz."], ["L", "2026-02-04T18:25", "Ha / eğer"], ["L", "2026-02-04T18:25", "Idő/ hava"], ["L", "2026-02-04T18:26", "Holnap reggeltől estig dolgozom,  de munka után, tudok teniszezni veletek"], ["L", "2026-02-04T18:38", "Csinálni/ yapmak"], ["L", "2026-02-04T18:38", "Vasalni/ ütü yapmak"], ["L", "2026-02-04T18:40", "Mit csinálsz munka után?\nMunka után otthon vasalok és televíziót nézek."], ["L", "2026-02-04T18:42", "Holnap reggel veled szeretnék menni vásárolni,  mert otthon nincs semmi."], ["L", "2026-02-04T18:43", "Semmi/ hiç birsey"], ["L", "2026-02-04T18:43", "Senki hiç kimse"], ["L", "2026-02-04T18:44", "Ma nagyon fáradt vagyok,ezért senkivel,  nem akarok beszélni."], ["L", "2026-02-04T18:46", "Holnap a kutyámmal akarok futni a parkban és utána otthon egyedül akarok kávézni."], ["L", "2026-02-04T18:47", , "2026-03-30T18:35", "Én nem tudok magyarul."], ["L", "2026-03-30T18:36", "Én sem/se tudok magyarul"], ["L", "2026-03-30T18:39", "Tolmács/ tercüman"], ["L", "2026-03-30T18:39", "Segíteni/ yardım etmek"], ["L", "2026-03-30T18:41", "A családom\nEz az én családom.\nEz az én anyukám.\nAz anyukám neve Anna.\nEz az ő háza.\nA háza nagy.\nEz az én apukám.\nAz apukám neve Péter.\nEz az ő autója.\nAz autója kék.\nEz az én szobám.\nA szobám kicsi.\nEz az én ágyam.\nAz ágyam kényelmes.\nEz a testvérem.\nA testvérem neve Lili.\nEz az ő könyve.\nA könyve az asztalon van.\nEz a mi kutyánk.\nA kutyánk neve Bodri.\nA kutyánk nagyon aranyos."], ["L", "2026-04-01T18:07", "Ma az iskolában sok gyerek volt, de az én osztályomban, csak négyen voltunk."], ["L", "2026-04-01T18:08", "Osztály/ sınıf"], ["L", "2026-04-01T18:09", "A szekrényetek hol van a hálószobában vagy az előszobában?"], ["L", "2026-04-01T18:11", "Holnap veletek szeretnék vacsorázni,  mert este nem szeretek itthon egyedül enni."], ["L", "2026-04-01T18:13", "Mellettem/ yanımda"], ["L", "2026-04-01T18:13", "Melletted/ senin yaninda"], ["L", "2026-04-01T18:13", "Mellette onun yanında"], ["L", "2026-04-01T18:14", "Mellettünk"], ["L", "2026-04-01T18:14", "Mellettetek"], ["L", "2026-04-01T18:15", "A szobámban a székem mellett egy könyvespolc van, előttem pedig egy nagy ablak van."], ["L", "2026-04-01T18:17", "Mi egy régi házban lakunk, fölöttünk pedig egy öreg néni lakik 3 fekete macskával."], ["L", "2026-04-01T18:21", "Én a nyolcadik emeleten lakom alattam a hetedik emeleten pedig egy kedves fiatal pár lakik."], ["L", "2026-04-01T18:24", "Emelet + en"], ["L", "2026-04-01T18:25", "Lévő/\"olan"], ["L", "2026-04-01T18:26", "A mellettünk lévő házban nem lakik senki, mert a ház nagyon régi és romos"], ["L", "2026-04-01T18:29", "Az asztalom előtt lévő virág nagyon szép, de túl nagy ."], ["L", "2026-04-01T18:32", "Az autótok hol parkol a házatok előtt lévő parkolóban vagy az alattatok lévő garázsban?"], ["L", "2026-04-01T18:37", "Holnap veletek együtt utazom a városba,  mert a fölöttem lévő lakásban az öreg néni  beteg és gyógyszert veszek a néninek"], ["L", "2026-04-01T18:38", "Gyógyszer/ ilaç"], ["L", "2026-04-01T18:40", "Beteg/ hasta"], ["L", "2026-04-01T18:40", "Néni + nek"], ["L", "2026-04-01T18:41", "A néninek van 3 macskája"], ["L", "2026-04-01T18:41", "Én virágot adok a néninek"], ["L", "2026-04-01T18:43", "Ma melletted szeretnék ülni a buszon, mert az út hosszú és szeretnék veled beszélgetni."], ["L", "2026-04-01T18:46", "Holnap nem tudok veled jönni futni reggel,mert a mögötte m lévő könyvespolcot kell tisztítani."], ["L", "2026-04-01T18:47", "Tisztítani = temizlemek"], ["L", "2026-04-01T18:47", "Kell/ lazım"], ["L", "2026-04-13T18:56", "Ma a kutyámmal az előttünk lévő parkba megyünk sétálni"], ["L", "2026-04-13T18:58", "Ti holnap mivel mentek dolgozni az autótokkal vagy Ali autójával?"], ["L", "2026-04-13T19:00", "Ma nem szeretnék veletek jönni,  mert a kutyám is velem jön, ezért inkább egyedül megyek."], ["L", "2026-04-13T19:02", "Holnap  mentek vásárolni?\nÉn is szeretnék veletek menni, mert az autóm szervizben van."], ["L", "2026-04-13T19:03", "Ayse háza mögött, van egy nagyon magas ház."], ["L", "2026-04-13T19:05", "Az ajtónk előtt van egy nagy zöld virág"], ["L", "2026-04-22T18:13", "A szobámban van egy magas szekrény,  és a szekrény fölött egy lámpa."], ["L", "2026-04-22T18:15", "Szerintem ez a szekrény nagyon magas, és nem illik ebbe a szobába ."], ["L", "2026-04-22T18:16", "Szerintem"], ["L", "2026-04-22T18:16", "Szerinted"], ["L", "2026-04-22T18:16", "Szerinte"], ["L", "2026-04-22T18:16", "Szerintünk"], ["L", "2026-04-22T18:16", "Szerintetek"], ["L", "2026-04-22T18:16", "Szerintük"], ["L", "2026-04-22T18:17", "Illik/ uygun"], ["L", "2026-04-22T18:17", "Nem illik uygun degil"], ["L", "2026-04-22T18:18", "Miatt/yüzünden"], ["L", "2026-04-22T18:18", "Ma miattad nem tudunk itthon enni, mert nincs itthon semmi."], ["L", "2026-04-22T18:20", "Holnap miattuk megyünk korán dolgozni,  mert ők korán akarnak az irodában kezdeni."], ["L", "2026-04-22T18:21", "Korán/ erken"], ["L", "2026-04-22T18:23", "Kezdeni"], ["L", "2026-04-22T18:24", "Holnap szeretnénk veletek ebédelni,  mert a szomszédunk miatt a házunkban, nincs víz."], ["L", "2026-04-22T18:25", "Szomszéd/ komşu"], ["L", "2026-04-22T18:27", "A fölöttünk lakó férfi kutyája miatt, sajnos nem tudunk aludni, mert egész éjjel ugat."], ["L", "2026-04-22T18:29", "Dolgozni/ dolgozó"], ["L", "2026-04-22T18:29", "Tanulni/ tanuló"], ["L", "2026-04-22T18:29", "Nézni/ néző"], ["L", "2026-04-22T18:29", "Olvasni/ olvasó"], ["L", "2026-04-22T18:30", "Írni/ iró"], ["L", "2026-04-22T18:30", "Lakni/ lakó"], ["L", "2026-04-22T18:31", "Lenni/ lévő"], ["L", "2026-04-22T18:31", "Lenni- nni= le+ vő= lévő"], ["L", "2026-04-22T18:34", "Ugatni/ havlamak"], ["L", "2026-04-22T18:35", "A kertünkben van egy nagy medence, és minden nyáron a medencében nagyon sok az úszó ember"], ["L", "2026-04-22T18:35", "Medence/ havuz\nÚszni/ yüzmek"], ["L", "2026-04-22T18:38", "A kertetekben vannak gyümölcsfák?\nIgen vannak.\nÉs virágok?\nVirágok is vannak\nÉs medence?\nMedence sajnos nincs, mert a kertünkben nincs elég hely."], ["L", "2026-04-22T18:42", "A lakásotokban hány szoba van?\n2 szobánk van.\nHány fürdőszobátok van?\n1\nÉs erkélyetek is van?\nSajnos erkélyünk nincs, de van egy nagy és nagyon világos konyhánk."], ["L", "2026-04-27T18:21", "– Szia, Anna! Mit csinálsz most?\n– Szia! Éppen kávét iszom és egy könyvet olvasok. És te?\n– Én a boltba megyek, mert nincs otthon kenyér.\n– Minden nap főzöl?\n– Igen, általában főzök, de ma csak egy gyors vacsorát készítek.\n– Mit eszel vacsorára?\n– Tésztát eszem zöldségekkel. Te mit szoktál enni este?\n– Én gyakran salátát eszem, mert könnyű és egészséges.\n– Hol dolgozol most?\n– Egy irodában dolgozom, de néha otthonról is dolgozom.\n– Mikor kezded a munkát?\n– Reggel nyolckor kezdem. És te?\n– Én kilenckor kezdek, de korán kelek.\n– Mit csinálsz reggel?\n– Reggelizem, felöltözöm és elindulok dolgozni.\n– Szereted a munkádat?\n– Igen, szeretem, mert érdekes. Te szereted?\n– Igen, de néha nagyon fáradt vagyok."], ["L", "2026-04-27T18:22", "Eszek/ eszem"], ["L", "2026-04-27T18:23", "Iszok/ iszom"], ["L", "2026-04-27T18:36", "Kell/ lazım"], ["L", "2026-04-27T18:36", "Kelni/ kalkmak"], ["L", "2026-04-27T18:37", "Ébredni/ uyanmak"], ["L", "2026-04-27T18:40", "– Szia, Péter! Hová mész most?\n– Szia! Az iskolába megyek. Ma sok órám van.\n– Melyik órád kezdődik először?\n– A magyar óra kezdődik nyolckor.\n– Szereted a magyar órát?\n– Igen, szeretem, mert érdekes.\n– Mit csináltok az órán?\n– Olvasunk, írunk és beszélgetünk.\n– Ki a tanárotok?\n– Kovács tanárnő tanít minket. Nagyon kedves.\n– Mit csinálsz iskola után?\n– Hazamegyek és tanulok egy kicsit.\n– Szoktál sportolni?\n– Igen, hetente kétszer focizom a barátaimmal.\n– Mikor találkozol velük?\n– Általában délután négykor találkozunk a pályán.\n– Jó szórakozást!\n– Köszönöm, szia!"], ["L", "2026-04-27T18:47", "Engem\nTéged\nŐt\nMinket\nTiteket\nŐket"], ["L", "2026-04-29T18:15", "1. Feladat – Egészítsd ki a mondatokat a megfelelő igealakkal! (jelen idő)\nÉn minden nap korán ______ (kel).\nTe gyakran ______ (olvas) könyvet?\nMi együtt ______ (tanul) magyarul.\nŐk a parkban ______ (sétál).\nTe mit ______ (csinál) este?\nÉn nem ______ (ért) ezt a feladatot.\nTi hol ______ (lakik)?\nŐ minden nap kávét ______ (iszik).\nMi nem ______ (néz) tévét este.\nÉn gyakran ______ (megy) boltba.\n2. Feladat – Írd át többes számba!\nÉn dolgozom → ______\nTe eszel → ______\nŐ olvas → ______\nÉn írok → ______\nTe tanulsz → ______\n3. Feladat – Tedd múlt időbe a mondatokat!\nÉn reggel kávét iszom. → ______\nŐ iskolába megy. → ______\nMi filmet nézünk. → ______\nTe zenét hallgatsz. → ______\nŐk sokat dolgoznak. → ______\n4. Feladat – Válaszd ki a helyes alakot!\nÉn minden nap dolgoz__\na) -ok\nb) -ik\nc) -unk\nTe mit csinál__?\na) -sz\nb) -unk\nc) -nak\nMi sokat tanul__\na) -sz\nb) -unk\nc) -nak\nŐk filmet néz__\na) -em\nb) -nek\nc) -sz\nŐ iskolába me__\na) -gy\nb) -sz\nc) -ünk\n5. Feladat – Írj teljes mondatot a megadott szavakkal!\nén / reggel / kávét / iszik → ______\nmi / este / tévét / néz → ______\nte / boltba / megy → ______\nők / parkban / sétál → ______\nő / könyvet / olvas → ______"], ["L", "2026-04-29T18:29", "Én iszok\nTe iszol\nŐ iszik\nMi iszunk\nTi isztok\nŐk isznak"], ["L", "2026-04-29T18:45", "Te hétköznap nem mész boltba, csak hétvégén mész boltba."], ["L", "2026-04-29T18:48", "Esik az eső"], ["L", "2026-04-29T18:50", "Ő szeret a kávézóban ülni olvasni és kávézni."], ["L", "2026-04-29T18:53", "Ő minden nap ebéd után, 15 percet, a kertben könyvet olvas."], ["L", "2026-04-29T18:53", "Ő mindennap ebed után 15 percet  könyvet olvas a kertben"], ["L", "2026-05-18T18:20", "– Jó napot kívánok! Mit szeretne rendelni?\n– Jó napot! Egy kávét és egy sajtos szendvicset szeretnék.\n– Kis kávét vagy nagy kávét kér?\n– Nagy kávét kérek,.\n– Szeretne még valamit?\n– Igen, kérek egy szelet csokoládétortát is.\n– Itt fogyasztja, vagy elvitelre lesz?\n– Itt szeretném megenni.\n– Rendben. A kávéja forró legyen?\n– Igen, forró legyen, kérem.\n– Összesen kétezer-hatszáz forint lesz.\n– Lehet kártyával fizetni?\n– Igen, természetesen.\n– Köszönöm szépen.\n– Szívesen."], ["L", "2026-05-18T18:23", "Fodyastya"], ["L", "2026-05-18T18:25", "Fo- gyaszt-ja"], ["L", "2026-05-18T18:33", "– Günaydın, hoş geldiniz. Ne almak istersiniz?\n– Günaydın. Bir kahve ve bir peynirli sandviç istiyorum.\n– Küçük kahve mi, büyük kahve mi?\n– Büyük olsun lütfen.\n– Başka bir şey ister misiniz?\n– Evet, bir dilim çikolatalı kek de alacağım.\n– Burada mı yiyeceksiniz, paket mi olacak?\n– Burada yiyeceğim.\n– Tamamdır. İçeceğiniz sıcak mı olsun?\n– Evet, sıcak olsun lütfen.\n– Toplam 260 lira.\n– Kredi kartı geçerli mi?\n– Evet, geçerli.\n– Teşekkür ederim.\n– Rica ederim."], ["L", "2026-05-18T18:37", "Çokoladee"], ["L", "2026-05-18T18:42", "– Jó estét kívánok! Van szabad asztal két főre?\n– Jó estét! Igen, van. Erre tessék!\n– Köszönjük szépen. Megkaphatjuk az étlapot?\n– Természetesen. Mit szeretnének inni?\n– Én egy ásványvizet kérek.\n– Én pedig egy limonádét szeretnék.\n– Rendben. Sikerült már választani az ételek közül?\n– Igen. Én egy gulyáslevest és grillezett csirkét kérek rizzsel.\n– Én pedig rántott sajtot kérek sült krumplival.\n– Rendben, hamarosan hozom az ételeket.\n– Nagyon finom volt minden. Kérhetjük a számlát?\n– Persze, máris hozom.\n– Lehet bankkártyával fizetni?\n– Igen, lehet.\n– Köszönjük szépen!\n– Szívesen, viszontlátásra!"], ["L", "2026-05-27T18:29", "– Jó napot! Hol van a bolt?\n– Jó napot! Ott, a sarkon.\n– Köszönöm. Messze van?\n– Nem, nagyon közel van.\n– Rendben. Köszönöm szépen!\n– Szívesen. Viszontlátásra!\n– Viszontlátásra!"], ["L", "2026-05-27T18:29", "– Szia! Hány óra van?\n– Fél három.\n– Köszönöm! Késésben vagyok.\n– Hova mész?\n– Az iskolába.\n– Sok szerencsét!\n– Köszönöm! Szia!\n– Szia!\n– Jó estét! Merre van a buszmegálló?\n– Ott, a park mellett.\n– Messze van?\n– Nem, két perc gyalog.\n– Köszönöm szépen!\n– Szívesen!\n– Elnézést, ez a 4-es villamos?\n– Igen, ez a 4-es villamos.\n– A központba megy?\n– Igen, odamegy.\n– Köszönöm!\n– Nincs mit."], ["L", "2026-05-27T18:45", "– Merhaba! Saat kaç?\n– Saat iki buçuk.\n– Teşekkür ederim! Geç kaldım.\n– Nereye gidiyorsun?\n– Okula gidiyorum.\n– Bol şans!\n– Teşekkür ederim! Hoşça kal!\n– Hoşça kal!\n– İyi akşamlar! Otobüs durağı nerede?\n– Orada, parkın yanında.\n– Uzak mı?\n– Hayır, yürüyerek iki dakika.\n– Çok teşekkür ederim!\n– Rica ederim!\n– Affedersiniz, bu 4 numaralı tramvay mı?\n– Evet, bu 4 numaralı tramvay.\n– Merkeze gidiyor mu?\n– Evet, gidiyor.\n– Teşekkür ederim!\n– Bir şey değil."], ["L", "2026-05-27T18:51", "– Jó reggelt!\n– Jó reggelt!\n– Hogy hívnak?\n– Anna vagyok. És téged?\n– Péter vagyok.\n– Örülök!\n– Hová mész?\n– A boltba megyek.\n– Mit veszel?\n– Kenyeret és tejet.\n– Rendben. Szia!\n– Szia!"], ["L", "2026-05-27T18:52", "– Günaydın!\n– Günaydın!\n– Adın ne?\n– Beni  mert az autónk náluk van, ezért reggel hozzájuk megyünk és csak utána megyünk vásárolni."], ["L", "2026-07-02T20:30", "Alival nem tudok beszélni, mert nem tud angolul,  ezért ma este nálatok vacsorázunk és veletek beszélgetünk"], ["L", "2026-07-02T20:34", "Bugün kuaföre gidiyorum, ondan sonra da seninle kahve içimek istiyorum eger vaktin varsa."], ["L", "2026-07-02T20:35", "Fodrász/ kuaför"], ["L", "2026-07-02T20:36", "Ma fodrászhoz megyek, utána pedig, szeretnék veled kávét inni, ha van időd."], ["L", "2026-07-02T20:38", "Seninle arkadaşıma gitmek istiyorum,  çünkü seninle de onunla da program yapmak cok seviyorum"], ["L", "2026-07-02T20:39", "Yapmak"], ["L", "2026-07-02T20:40", "Szeretnék veled a barátomhoz menni, veled is vele is szeretek programot,  csinálni."], ["L", "2026-07-06T18:18", "Nak, nek\nNekem.."], ["L", "2026-07-06T18:19", "Nál/ nél..\nNálam..."], ["L", "2026-07-06T18:19", "Hoz, hez höz\nHozzám."], ["L", "2026-07-06T18:19", "Val, vel,\nVelem.."], ["L", "2026-07-06T18:20", "Tol, től"], ["L", "2026-07-06T18:20", "Tőlem"], ["L", "2026-07-06T18:20", "Tőled"], ["L", "2026-07-06T18:20", "Tőle"], ["L", "2026-07-06T18:20", "Tőlünk"], ["L", "2026-07-06T18:20", "Tőletek"], ["L", "2026-07-06T18:20", "Tőlük"], ["L", "2026-07-06T18:21", "Ma este először hozzám jöttök,  utána tőlem hozzájuk megyünk."], ["L", "2026-07-06T18:24", "Holnap veletek vacsorázunk és vacsora után, hozzátok megyünk,  tőletek pedig haza jövünk."], ["L", "2026-07-06T18:27", "Ali holnap veled szeretnék ebédelni, de nem nálad, hanem egy étteremben,  és ebéd után veled együtt hozzám jövünk este pedig tőlem megyünk a repülőtérre."], ["L", "2026-07-06T18:31", "Ha holnap fodrászhoz tudok menni, akkor a fodrásztól, telefonálok neked, és este nálam vacsorázunk,  ha neked is jó."], ["L", "2026-07-06T18:32", "Fodrász/ kuaför"], ["L", "2026-07-06T18:32", "Akkor/ ozaman"], ["L", "2026-07-06T18:34", "Holnap délben a barátomnál ebédelünk,  és este tőle megyünk a színházba,  utána pedig hozzátok megyünk és 7T18:23", "Ez a táska drágább, mint az a táska.\nA piacon a zöldség olcsóbb, mint a boltban.\nPéter magasabb, mint Gábor.\nAnna alacsonyabb, mint a testvére.\nEz az út rövidebb, mint a másik.\nA Duna hosszabb, mint a Tisza.\nA busz lassabb, mint a vonat.\nEz a szálloda drágább, mint a másik.\nPéter a legmagasabb a családban.\nEz a legolcsóbb ruha a boltban.\nA kék szoknya hosszabb, mint a fekete.\nEz a legrövidebb út az iskolába.\nA bicikli lassabb, mint az autó.\nEz a legdrágább étterem a városban.\nAnna haja hosszabb, mint Éváé."], ["L", "2026-09-17T18:32", "Bu çanta o çantadan daha pahalı.\nPazarda sebzeler markettekinden daha ucuz.\nPeter, Gábor'dan daha uzun boylu.\nAnna, kardeşinden daha kısa boylu.\nBu yol diğer yoldan daha kısa.\nTuna, Tisza'dan daha uzun.\nOtobüs trenden daha yavaş.\nBu otel diğer otelden daha pahalı.\nPeter ailedeki en uzun boylu kişidir.\nBu, mağazadaki en ucuz elbise.\nMavi etek siyah etekten daha uzun.\nBu, okula giden en kısa yol.\nBisiklet arabadan daha yavaş.\nBu, şehirdeki en pahalı restoran.\nAnna'nın saçı Éva'nın saçından daha uzun."], ["L", "2026-10-06T18:22", "A leggyakoribb kérdőszavak magyarul:\nKi? – Kim?\nMi? – Ne?\nHol? – Nerede?\nHová? – Nereye?\nHonnan? – Nereden?\nMikor? – Ne zaman?\nMiért? – Neden? / Niçin?\nHogyan? / Hogy? – Nasıl?\nMilyen? – Nasıl? / Ne tür?\nMelyik? – Hangisi?\nMennyi? – Ne kadar?\nHány? – Kaç?\nKinek? – Kime? / Kimin?\nKit? – Kimi?\nMit? – Neyi?\nKivel? – Kiminle?\nMivel? – Neyle?\nKiről? – Kimden? / Kimin hakkında?\nMiről? – Neden? / Ne hakkında?\nKi lakik ebben a házban?\nMi van az asztalon?\nHol dolgozik az apukád?\nHová mész iskola után?\nHonnan jöttél?\nMikor kezdődik az óra?\nMiért vagy fáradt?\nHogyan mész dolgozni?\nMilyen könyvet olvasol?\nMelyik kabát a tiéd?\nMennyi tej van a hűtőben?\nHány testvéred van?\nKinek adod ezt a virágot?\nKit vársz a buszmegállóban?\nMit főzöl vacsorára?\nKivel mész moziba?\nMivel utazol Budapestre?\nKiről beszéltek?\nMiről szól ez a film?\nMikor kelsz fel reggel?\nHol találkozol a barátaiddal?\nMiért tanulsz magyarul?\nMelyik ételt szereted a legjobban?\nHánykor indulsz otthonról?\nHogyan készíted a kávét?"], ["L", "2026-10-06T18:37", "Soru kelimeleri\nKim?\nNe?\nNerede?\nNereye?\nNereden?\nNe zaman?\nNeden? / Niçin?\nNasıl?\nNasıl? / Ne tür?\nHangisi? / Hangi?\nNe kadar?\nKaç?\nKime?\nKimi?\nNeyi? / Ne?\nKiminle?\nNeyle?\nKimden? / Kimin hakkında?\nNeyden? / Ne hakkında?\nSorular\nBu evde kim oturuyor?\nMasanın üzerinde ne var?\nBaban nerede çalışıyor?\nOkuldan sonra nereye gidiyorsun?\nNereden geldin?\nDers ne zaman başlıyor?\nNeden yorgunsun?\nİşe nasıl gidiyorsun?\nNasıl bir kitap okuyorsun?\nHangi mont senin?\nBuzdolabında ne kadar süt var?\nKaç kardeşin var?\nBu çiçeği kime veriyorsun?\nOtobüs durağında kimi bekliyorsun?\nAkşam yemeği için ne pişiriyorsun?\nSinemaya kiminle gidiyorsun?\nBudapeşte'ye neyle gidiyorsun?\nKimden bahsediyorsunuz?\nBu film ne hakkında?\nSabah ne zaman kalkıyorsun?\nArkadaşlarınla nerede buluşuyorsun?\nNeden Macarca öğreniyorsun?\nEn çok hangi yemeği seviyorsun?\nEvden saat kaçta çıkıyorsun?\nKahveyi nasıl hazırlıyorsun?"], ["L", "2026-10-06T18:39", "[görsel] Média"], ["L", "2026-10-06T18:40", "[görsel] Média"], ["L", "2026-10-06T18:46", "[görsel] Média"], ["L", "2026-10-13T18:13", "telefonjaim"], ["L", "2026-10-13T18:17", "[görsel] Média"], ["L", "2026-10-13T18:34", "focizik"], ["L", "2026-10-13T18:34", "focizni"], ["L", "2026-10-13T18:37", "a kutya futott a labda után"], ["L", "2026-10-13T18:43", "Magyar igék ragozása – jelen és múlt idő\n1. LÁTNI\nSzemély\nJelen idő\nMúlt idő\nÉn\nlátok\nláttam\nTe\nlátsz\nláttál\nŐ\nlát\nlátott\nMi\nlátunk\nláttunk\nTi\nláttok\nláttatok\nŐk\nlátnak\nláttak\n2. FUTNI\nSzemély\nJelen idő\nMúlt idő\nÉn\nfutok\nfutottam\nTe\nfutsz\nfutottál\nŐ\nfut\nfutott\nMi\nfutunk\nfutottunk\nTi\nfuttok\nfutottatok\nŐk\nfutnak\nfutottak\n3. VACSORÁZNI\nSzemély\nJelen idő\nMúlt idő\nÉn\nvacsorázom\nvacsoráztam\nTe\nvacsorázol\nvacsoráztál\nŐ\nvacsorázik\nvacsorázott\nM s": ["1. első, 2. második, 3. harmadik, 4. negyedik, 5. ötödik, 6. hatodik, 7. hetedik, 8. nyolcadik, 9. kilencedik, 10. tizedik.", "Yazıda sıra sayısı rakam + nokta ile yazılır: 4. emelet = negyedik emelet; XIII. kerület = tizenharmadik kerület.", "Hány óra van? – Három óra van. Fél három = iki buçuk (üçün yarısı). Negyed három = 2:15, háromnegyed három = 2:45.", "Hánykor? – Hatkor, nyolckor, 12-kor (saat ... -de).", "Kat: emelet + -en → a negyedik emeleten lakom."], "table": {"head": ["Sayı", "Sıra", "Saat -kor"], "rows": [["egy", "első", "egykor"], ["kettő", "második", "kettőkor"], ["három", "harmadik", "háromkor"], ["négy", "negyedik", "négykor"], ["öt", "ötödik", "ötkor"], ["hat", "hatodik", "hatkor"], ["hét", "hetedik", "hétkor"], ["nyolc", "nyolcadik", "nyolckor"], ["tíz", "tizedik", "tízkor"], ["tizenkettő", "tizenkettedik", "tizenkettőkor"]]}, "ex": [["Én a nyolcadik emeleten lakom, alattam a hetediken egy fiatal pár lakik.", "Ben sekizinci katta oturuyorum, altımda yedinci katta genç bir çift oturuyor."], ["XIII. kerület, Kassák Lajos utca 11–13., 4. emelet 28.", "13. bölge, Kassák Lajos sokağı 11–13, 4. kat 28 numara"], ["Szia! Hány óra van? – Fél három.", "Selam! Saat kaç? – İki buçuk."], ["12 órát aludtam, 12-kor ébredtem.", "12 saat uyudum, 12'de uyandım."]], "vocab": [["első", "birinci"], ["második", "ikinci"], ["emelet", "kat"], ["kerület", "bölge (semt)"], ["utca", "sokak"], ["ajtó", "kapı, daire no."], ["irányítószám", "posta kodu"], ["fél", "yarım, buçuk"], ["negyed", "çeyrek"], ["Hánykor?", "Saat kaçta?"]], "read": ["A címem", "A címem: Budapest, tizenharmadik kerület, Kassák Lajos utca tizenegy. A negyedik emeleten lakom, a huszonnyolcas ajtóban. Minden reggel hétkor kelek, és fél nyolckor indulok dolgozni. Az iroda az első emeleten van. Délután ötkor jövök haza.", "Adresim: Budapeşte, 13. bölge, Kassák Lajos sokağı 11. Dördüncü katta, 28 numaralı dairede oturuyorum. Her sabah yedide kalkıyorum ve yedi buçukta işe çıkıyorum. Ofis birinci katta. Öğleden sonra beşte eve geliyorum."], "quiz": [["'Dördüncü kat' hangisi?", ["négy emelet", "negyedik emelet", "negyed emelet", "négyes emelet"], 1, "Sıra sayısı: negyedik."], ["'Fél három' saat kaç?", ["3:30", "2:30", "3:15", "2:15"], 1, "Üçün yarısı = 2:30."], ["'Sekizde' hangisi?", ["nyolcban", "nyolckor", "nyolcadik", "nyolcra"], 1, "Saat için -kor."], ["'İkinci' hangisi?", ["kettedik", "második", "kétedik", "kettődik"], 1, "Düzensiz: második."]], "id": 5}, {"id": 6, "hu": "Színek", "tr": "Renkler ve gündelik eşyalar", "dates": ["2025-10-15"], "intro": "Renkler sıfattır ve ismin önüne gelir. Açık/koyu ton için 'világos' ve 'sötét' kelimenin başına bitişik yazılır: világoszöld, sötétkék.", "rules": ["Szín = renk → színes (renkli), színtelen (renksiz). -s sıfat yapar, -talan/-telen yokluk bildirir.", "Sötét / világos hem renk tonu hem ortam için kullanılır: A szobában sötét van. (Odada karanlık.)", "Sarı saç için 'szőke' kullanılır, 'sárga' değil."], "table": null, "ex": [["Ez a ruha világoszöld.", "Bu elbise açık yeşil."], ["A szobában világos van.", "Odada aydınlık."], ["Fekete ing, fehér tányér, piros cipő", "Siyah gömlek, beyaz tabak, kırmızı ayakkabı"], ["Kék ég, kék tenger", "Mavi gökyüzü, mavi deniz"]], "vocab": [["fekete", "siyah"], ["fehér", "beyaz"], ["piros", "kırmızı"], ["zöld", "yeşil"], ["barna", "kahverengi"], ["sárga", "sarı"], ["narancssárga", "turuncu"], ["kék", "mavi"], ["sötétkék", "lacivert"], ["szürke", "gri"], ["rózsaszín", "pembe"], ["lila", "mor"], ["ing", "gömlek"], ["nadrág", "pantolon"], ["szoknya", "etek"], ["kabát", "mont"], ["sapka", "bere"], ["felhő", "bulut"]], "read": ["Mi milyen színű?", "A citrom sárga, a körte zöld. Az ég kék, a felhők fehérek. Péteren fekete nadrág és fehér ing van. Anna szőke, és ma piros szoknya van rajta. A szobában a függöny sötétkék.", "Limon sarı, armut yeşil. Gökyüzü mavi, bulutlar beyaz. Péter'in üstünde siyah pantolon ve beyaz gömlek var. Anna sarışın ve bugün üstünde kırmızı bir etek var. Odada perde lacivert."], "quiz": [["'Lacivert' Macarcada?", ["világoskék", "sötétkék", "lila", "szürke"], 1, "sötét (koyu) + kék."], ["Sarı saçlı kişi için hangisi?", ["sárga", "szőke", "barna", "narancssárga"], 1, "Saç için 'szőke'."], ["'Színtelen' ne demek?", ["renkli", "renksiz", "koyu", "açık"], 1, "-telen = -siz."], ["'Piros' hangi renk?", ["pembe", "turuncu", "kırmızı", "mor"], 2, "piros = kırmızı."]]}, {"hu": "Többes szám", "tr": "Çoğul isimler (-k, -ok, -ek, -ök, -ak)", "dates": ["2025-10-09", "2025-11-05", "2026-03-04", "2026-07-15"], "intro": "Macarcada çoğul eki -k'dır. Ünlüyle biten kelimeye doğrudan eklenir (a → á, e → é). Ünsüzle biten kelimeye bağlayıcı ünlü girer: -ok / -ek / -ök, bazı kelimelerde -ak. Sayıdan ve 'sok, kevés, minden' gibi miktar sözcüklerinden sonra isim tekil kalır.", "rules": ["Ünlüyle: autó → autók, alma → almák, kefe → kefék, óra → órák.", "Ünsüzle kalın: polc → polcok, asztal → asztalok; bazıları -ak: ház → házak, toll → tollak, fal → falak.", "İnce: kert → kertek, szék → székek, hét → hetek.", "Yuvarlak ince: gyümölcs → gyümölcsök, sör → sörök.", "Kısalan kelimeler: év → évek, ló → lovak, kenyér → kenyerek.", "Sayıdan sonra tekil: 3 szoba, 5 könyv, sok ember (çok insan) — 'sok emberek' denmez.", "Çoğul + nesne -t: almákat, könyveket, házakat."], "table": {"head": ["Tekil", "Çoğul", "Tekil", "Çoğul"], "rows": [["nap", "napok", "év", "évek"], ["óra", "órák", "hét", "hetek"], ["szoba", "szobák", "perc", "percek"], ["polc", "polcok", "szék", "székek"], ["ház", "házak", "kert", "kertek"], ["fal", "falak", "gyümölcs", "gyümölcsök"], ["toll", "tollak", "könyv", "könyvek"], ["ablak", "ablakok", "fa", "fák"]]}, "ex": [["Nap → napok, hónap → hónapok, év → évek", "Gün → günler, ay → aylar, yıl → yıllar"], ["A szobában a falakon polcok vannak, a polcokon könyvek.", "Odada duvarlarda raflar, raflarda kitaplar var."], ["Az asztalon 3 váza van.", "Masada 3 vazo var. (sayıdan sonra tekil)"], ["Ezek a kertek szép virágosak.", "Bu bahçeler çok çiçekli."]], "vocab": [["többes szám", "çoğul"], ["egyes szám", "tekil"], ["könyvek", "kitaplar"], ["házak", "evler"], ["fák", "ağaçlar"], ["emberek", "insanlar"], ["gyerekek", "çocuklar"], ["lányok", "kızlar"]], "read": ["Az utcánkban", "Az utcánkban régi házak és magas fák vannak. A házak előtt kis kertek vannak, a kertekben virágok és gyümölcsfák. Reggel a gyerekek iskolába mennek, a felnőttek dolgozni. Délután sok ember sétál a parkban.", "Sokağımızda eski evler ve uzun ağaçlar var. Evlerin önünde küçük bahçeler var, bahçelerde çiçekler ve meyve ağaçları. Sabah çocuklar okula, yetişkinler işe gidiyor. Öğleden sonra parkta çok insan yürüyor."], "quiz": [["'Ház' çoğulu?", ["házok", "házak", "házek", "házk"], 1, "ház → házak."], ["'Szék' çoğulu?", ["székok", "székek", "székak", "székök"], 1, "İnce → -ek."], ["Hangisi doğru?", ["3 könyvek", "3 könyv", "3 könyvök", "3 könyvak"], 1, "Sayıdan sonra tekil."], ["'Gyümölcs' çoğulu?", ["gyümölcsek", "gyümölcsok", "gyümölcsök", "gyümölcsak"], 2, "Yuvarlak ince → -ök."]], "id": 7}, {"id": 8, "hu": "Hol van? – Névutók", "tr": "Yer bildiren edatlar (önünde, arkasında, yanında…)", "dates": ["2025-10-29", "2025-11-17", "2025-11-26"], "intro": "Macarcada yer edatları ismin arkasına gelir (Türkçedeki gibi): a ház előtt = evin önünde. 'Van' (var) ile basit tasvir cümleleri kurulur.", "rules": ["előtt (önünde), mögött (arkasında), mellett (yanında), fölött (üstünde, değmeden), alatt (altında), között (arasında).", "jobbra / balra = sağda / solda (yön).", "Tekil özne → van, çoğul özne → vannak: A ház előtt virág van. / virágok vannak.", "Soru: Hol van…? (Nerede?) Mi van…? (Ne var?)"], "table": {"head": ["Macarca", "Türkçe", "Örnek"], "rows": [["előtt", "önünde", "a ház előtt"], ["mögött", "arkasında", "a ház mögött"], ["mellett", "yanında", "a ház mellett"], ["fölött", "üstünde", "a ház fölött"], ["alatt", "altında", "az asztal alatt"], ["között", "arasında", "a fák között"]]}, "ex": [["A ház mögött egy fa van.", "Evin arkasında bir ağaç var."], ["A ház mellett jobbra almafa van.", "Evin yanında sağda elma ağacı var."], ["A ház fölött felhők vannak.", "Evin üstünde bulutlar var."], ["A kis asztal az ablak előtt van.", "Küçük masa pencerenin önünde."], ["Isztambul és Budapest között az út nagyon hosszú.", "İstanbul ile Budapeşte arasındaki yol çok uzun."]], "vocab": [["jobb", "sağ"], ["bal", "sol"], ["virág", "çiçek"], ["fa", "ağaç"], ["almafa", "elma ağacı"], ["út", "yol"], ["domb", "tepe"], ["hegy", "dağ"], ["magas", "yüksek"], ["alacsony", "alçak"], ["hosszú", "uzun"], ["rövid", "kısa"], ["papucs", "terlik"], ["csizma", "çizme"]], "read": ["A sárga ház", "A kertben, a fák között egy nagy sárga ház van. A házon egy barna ajtó és két ablak van. A ház előtt hosszú, virágos út van. A ház mellett jobbra egy kis piros kutyaház van. A ház mögött magas hegyek vannak, a ház fölött pedig a nap és a felhők.", "Bahçede, ağaçların arasında büyük sarı bir ev var. Evin üzerinde kahverengi bir kapı ve iki pencere var. Evin önünde uzun, çiçekli bir yol var. Evin yanında sağda küçük kırmızı bir köpek kulübesi var. Evin arkasında yüksek dağlar, evin üstünde de güneş ve bulutlar var."], "quiz": [["'Evin arkasında' hangisi?", ["a ház előtt", "a ház mögött", "a ház alatt", "a ház mellett"], 1, "mögött = arkasında."], ["A ház előtt virágok ___.", ["van", "vannak", "vagyok", "nincs"], 1, "Çoğul özne → vannak."], ["'Fölött' ne demek?", ["altında", "yanında", "üstünde", "arasında"], 2, "fölött = üstünde."], ["'Nerede?' sorusu hangisi?", ["Mi?", "Hol?", "Hány?", "Ki?"], 1, "Hol? = Nerede?"]]}, {"id": 9, "hu": "A lakásban – -ban/-ben, -on/-en/-ön", "tr": "Evde: eşyalar, var / yok, egyik / másik", "dates": ["2025-11-03", "2025-11-05", "2025-11-12", "2025-11-26"], "intro": "Bir şeyin içinde olmak -ban/-ben, üzerinde olmak -on/-en/-ön ile söylenir. Ek, kelimenin ünlü uyumuna göre seçilir. Olumsuzda 'van' yerine 'nincs', 'vannak' yerine 'nincsenek' kullanılır.", "rules": ["İçinde: szoba → szobában, könyv → könyvben, szekrény → szekrényben.", "Üstünde: asztal → asztalon, szék → széken, ajtó → ajtón, fa → fán (a → á).", "Kişi üzerindeki giysi de -on/-en ile: Umuton fehér pulóver van.", "pedig = ise (karşılaştırma), de = ama: Az irodában asztalok vannak, de szekrények nincsenek.", "egyik / másik = biri / diğeri."], "table": {"head": ["Kelime", "-ban/-ben", "Kelime", "-on/-en/-ön"], "rows": [["szoba", "szobában", "asztal", "asztalon"], ["ház", "házban", "szék", "széken"], ["iskola", "iskolában", "fal", "falon"], ["város", "városban", "polc", "polcon"], ["könyv", "könyvben", "ajtó", "ajtón"], ["doboz", "dobozban", "fa", "fán"]]}, "ex": [["Az asztalon váza van, a vázában virág van.", "Masanın üstünde vazo var, vazoda çiçek var."], ["A kanapé fölött egy könyvespolc van.", "Kanepenin üstünde bir kitaplık var."], ["A szobában a falakon polcok vannak, a polcokon pedig könyvek.", "Odada duvarlarda raflar, raflarda ise kitaplar var."], ["Az egyikben 2, a másikban 1 virág van.", "Birinde 2, diğerinde 1 çiçek var."], ["Hol van a piros csizma? – A szekrényben.", "Kırmızı çizme nerede? – Dolapta."]], "vocab": [["szekrény", "dolap"], ["szék", "sandalye"], ["fotel", "berjer"], ["lámpa", "lamba"], ["szőnyeg", "halı"], ["polc", "raf"], ["könyvespolc", "kitaplık"], ["kép", "resim"], ["fal", "duvar"], ["nappali", "oturma odası"], ["hálószoba", "yatak odası"], ["fürdőszoba", "banyo"], ["bútor", "mobilya"], ["kert", "bahçe"], ["pedig", "ise"], ["de", "ama"], ["nincs / nincsenek", "yok"]], "read": ["Az én szobám", "A szobámban világoszöld falak vannak. Az egyik falon egy nagy ablak van, a másikon szép képek. Az ablak előtt egy asztal és két szék van. Az asztalon egy váza van, a vázában sárga virágok. A szekrényben ruhák vannak, a polcokon pedig könyvek. Tévé nincs a szobában.", "Odamda açık yeşil duvarlar var. Duvarlardan birinde büyük bir pencere, diğerinde güzel resimler var. Pencerenin önünde bir masa ve iki sandalye var. Masanın üstünde bir vazo, vazoda sarı çiçekler var. Dolapta giysiler, raflarda ise kitaplar var. Odada televizyon yok."], "quiz": [["'Dolapta' hangisi?", ["szekrényen", "szekrényben", "szekrénnyel", "szekrénynél"], 1, "İçinde → -ben."], ["'Duvarda (üstünde)' hangisi?", ["falban", "falon", "falen", "falnál"], 1, "Kalın ünlü → -on."], ["Az irodában szekrények ___.", ["nincs", "nincsenek", "vannak nem", "van"], 1, "Çoğul olumsuz → nincsenek."], ["'Pedig' ne demek?", ["ama", "ise", "ve", "çünkü"], 1, "pedig = ise."]]}, {"hu": "-ban/-ben, -ba/-be, -ból/-ből", "tr": "İçinde / içine / içinden", "dates": ["2025-11-05", "2026-01-21", "2026-03-18", "2026-03-23", "2026-09-10"], "intro": "Kapalı bir yerle ilgili üç soru üç ek ister: Hol? (nerede) → -ban/-ben, Hová? (nereye) → -ba/-be, Honnan? (nereden) → -ból/-ből. Şehirler, binalar, odalar, kaplar bu gruptadır.", "rules": ["Hol? → a szobában, a kertben, Isztambulban.", "Hová? → a szobába, a kertbe, iskolába, moziba.", "Honnan? → a szobából, a kertből, a boltból.", "ez/az da ek alır: ebben/abban, ebbe/abba, ebből/abból.", "Aylar ve yıllar da -ban/-ben alır: júliusban, 2025-ben."], "table": {"head": ["Kelime", "Hol? -ban/-ben", "Hová? -ba/-be", "Honnan? -ból/-ből"], "rows": [["szoba", "szobában", "szobába", "szobából"], ["iskola", "iskolában", "iskolába", "iskolából"], ["bolt", "boltban", "boltba", "boltból"], ["kert", "kertben", "kertbe", "kertből"], ["étterem", "étteremben", "étterembe", "étteremből"], ["ez / az", "ebben / abban", "ebbe / abba", "ebből / abból"]]}, "ex": [["Holnap iskolába megyek.", "Yarın okula gidiyorum."], ["Ebbe a házba megyek, abból az üzletből jövünk.", "Bu eve gidiyorum, o dükkândan geliyoruz."], ["A kutya ebből a kertből fut.", "Köpek bu bahçeden koşuyor."], ["Vacsorázni megyünk egy jó étterembe.", "Akşam yemeğine iyi bir restorana gidiyoruz."]], "vocab": [["iskola", "okul"], ["mozi", "sinema"], ["étterem", "restoran"], ["üzlet", "dükkân"], ["bolt", "market"], ["doboz", "kutu"], ["pohár", "bardak"], ["zseb", "cep"]], "read": ["Reggel és este", "Reggel kijövök a hálószobából, és a konyhába megyek. A konyhában kávét főzök. Nyolckor elindulok a házból, és az irodába megyek. Este az irodából a boltba megyek, a boltból pedig haza.", "Sabah yatak odasından çıkıp mutfağa gidiyorum. Mutfakta kahve yapıyorum. Sekizde evden çıkıp ofise gidiyorum. Akşam ofisten markete, marketten de eve gidiyorum."], "quiz": [["'Okula gidiyorum': ___ megyek.", ["iskolában", "iskolába", "iskolából", "iskolán"], 1, "Hová? → -ba."], ["'Marketten geliyorum': a ___ jövök.", ["boltba", "boltban", "boltból", "bolton"], 2, "Honnan? → -ból."], ["'Bu kutuya': ___ a dobozba", ["ebben", "ebbe", "ebből", "ezen"], 1, "ez + -be → ebbe."], ["'Bahçede' hangisi?", ["kertbe", "kertben", "kertből", "kerten"], 1, "Hol? → -ben."]], "id": 10}, {"hu": "-on/-en/-ön, -ra/-re, -ról/-ről", "tr": "Üstünde / üstüne / üstünden (ve hakkında)", "dates": ["2025-11-05", "2026-03-18", "2026-06-08", "2026-07-06", "2026-09-10"], "intro": "Yüzeylerle ilgili üç ek: Hol? → -on/-en/-ön (üstünde), Hová? → -ra/-re (üstüne), Honnan? → -ról/-ről (üstünden). -ról/-ről ayrıca 'hakkında' demektir: a filmről beszélünk. Macaristan'daki şehirlerin çoğu ve Magyarország da bu ekleri alır: Budapesten, Budapestre, Budapestről.", "rules": ["Hol? → az asztalon, a széken, a földön, Budapesten.", "Hová? → az asztalra, a székre, Budapestre.", "Honnan? → az asztalról, a székről, Budapestről.", "Hakkında: a filmről, rólad (senin hakkında), Aliról.", "Kişi üstündeki giysi: Umuton fehér pulóver van."], "table": {"head": ["Kelime", "Hol?", "Hová?", "Honnan?"], "rows": [["asztal", "asztalon", "asztalra", "asztalról"], ["szék", "széken", "székre", "székről"], ["föld", "földön", "földre", "földről"], ["polc", "polcon", "polcra", "polcról"], ["Budapest", "Budapesten", "Budapestre", "Budapestről"], ["ez / az", "ezen / azon", "erre / arra", "erről / arról"]]}, "ex": [["A tollat az asztalra tettem.", "Kalemi masaya koydum."], ["A kulcs ezen az asztalon van, nem azon.", "Anahtar bu masada, şunda değil."], ["Arra a székre ülj!", "Şu sandalyeye otur!"], ["Erről a könyvről beszélünk.", "Bu kitap hakkında konuşuyoruz."], ["Hétfőtől péntekig Mezőberényben, péntektől Budapesten vagyok.", "Pazartesiden cumaya Mezőberény'de, cumadan itibaren Budapeşte'deyim."]], "vocab": [["tenni", "koymak"], ["ülni", "oturmak"], ["föld", "yer"], ["tető", "çatı"], ["busz", "otobüs (buszon: otobüste)"], ["beszélni vmiről", "bir şey hakkında konuşmak"]], "read": ["A kulcs", "Hol a kulcsom? Tegnap az asztalra tettem, de most nincs az asztalon. Megnézem a polcon és a széken is. A macska leugrik a székről, és alatta ott van a kulcs! Este Erdemnek elmesélem, és sokat nevetünk erről.", "Anahtarım nerede? Dün masaya koydum ama şimdi masada yok. Rafa ve sandalyeye de bakıyorum. Kedi sandalyeden atlıyor ve altında anahtar orada! Akşam Erdem'e anlatıyorum ve buna çok gülüyoruz."], "quiz": [["'Masaya koydum': az ___ tettem.", ["asztalon", "asztalra", "asztalról", "asztalba"], 1, "Hová? → -ra."], ["'Budapeşte'de' hangisi?", ["Budapestben", "Budapesten", "Budapestre", "Budapestnél"], 1, "Budapest -en alır."], ["'Film hakkında' hangisi?", ["a filmről", "a filmben", "a filmre", "a filmnél"], 0, "-ról/-ről = hakkında."], ["'Sandalyeden' hangisi?", ["székről", "székből", "széken", "székre"], 0, "Yüzeyden → -ről."]], "id": 11}, {"id": 12, "hu": "Melléknevek és többes szám", "tr": "Sıfatlar, zıt anlamlılar ve çoğul yüklem", "dates": ["2025-11-12", "2025-12-03", "2026-07-15"], "intro": "Sıfat ismin önündeyse değişmez: piros autók. Ama sıfat yüklem olduğunda çoğul özneyle birlikte çoğul eki alır: Az autók pirosak.", "rules": ["Sıfat önde → ek yok: nagy szekrények, fiatal lányok.", "Sıfat yüklem → çoğul: A szekrények nagyok. A lányok fiatalok. A virágok sárgák (a → á).", "Çoğul eki ünlü uyumuyla: -ak/-ok/-ek/-ök (szép → szépek, okos → okosak, kedves → kedvesek).", "Zıtlar: nagy <> kis/kicsi, szép <> csúnya, fiatal <> öreg, új <> régi, hosszú <> rövid, magas <> alacsony. 'kis' sadece ismin önünde, 'kicsi' her yerde."], "table": {"head": ["Sıfat önde", "Sıfat yüklem"], "rows": [["A piros ház előtt piros autók vannak.", "A piros ház előtt az autók pirosak."], ["A vázában sárga virágok vannak.", "A vázában a virágok sárgák."], ["Az utcán öreg nénik vannak.", "Az utcán a nénik öregek."], ["A házban nagy és kicsi szekrények vannak.", "A szekrények nagyok és kicsik."]]}, "ex": [["A ház kicsi, és nagyon szép.", "Ev küçük ve çok güzel."], ["A nagy kertben öreg és fiatal gyümölcsfák vannak.", "Büyük bahçede yaşlı ve genç meyve ağaçları var."], ["A lakásban nincs nagy bútor, csak kis bútor van.", "Dairede büyük mobilya yok, sadece küçük mobilya var."], ["Ezek a kertek szép virágosak.", "Bu bahçeler çok çiçekli."]], "vocab": [["nagy", "büyük"], ["kicsi / kis", "küçük"], ["szép", "güzel"], ["csúnya", "çirkin"], ["fiatal", "genç"], ["öreg", "yaşlı"], ["új", "yeni"], ["régi", "eski"], ["okos", "akıllı"], ["kedves", "sevimli, nazik"], ["néni", "teyze"], ["lakás", "daire"], ["csak", "sadece"], ["minden", "her"]], "read": ["Az utcán", "Az utcán sok ember van. A nénik öregek, a lányok fiatalok. A régi ház előtt egy új piros autó áll. A házak nagyok és szépek, de az egyik ház nagyon régi. A kertekben a fák magasak, a virágok pedig színesek.", "Sokakta çok insan var. Teyzeler yaşlı, kızlar genç. Eski evin önünde yeni kırmızı bir araba duruyor. Evler büyük ve güzel ama evlerden biri çok eski. Bahçelerde ağaçlar uzun, çiçekler ise rengarenk."], "quiz": [["Az autók ___.", ["piros", "pirosak", "pirosok", "pirosek"], 1, "Yüklemde çoğul: pirosak."], ["'Szép' kelimesinin yüklem çoğulu?", ["szépak", "szépok", "szépek", "szépök"], 2, "İnce ünlü → -ek."], ["'Régi' zıt anlamlısı?", ["öreg", "új", "fiatal", "kicsi"], 1, "régi (eski) <> új (yeni)."], ["Hangisi doğru?", ["A kis ház a kertben van.", "A ház kis.", "A kis házak kisek.", "Kis vagyok."], 0, "'kis' yalnız ismin önünde kullanılır; yüklemde 'kicsi'."]]}, {"id": 13, "hu": "Lenni – vagyok, vagy, van", "tr": "'Olmak' fiili ve kişi zamirleri", "dates": ["2025-12-08"], "intro": "'Lenni' (olmak) fiilinin şimdiki zamanı düzensizdir. 3. tekil ve çoğul kişide durum/kimlik söylerken 'van/vannak' çoğunlukla düşer: Ő Kata. Ők németek.", "rules": ["Yer bildirirken 3. kişide van/vannak kalır: Ő itt van. Ők itt vannak.", "Kimlik/meslek söylerken 3. kişide düşer: Ő tanár. Ők magyarok.", "Olumsuz: nem vagyok, nem vagy, nincs, nem vagyunk, nem vagytok, nincsenek."], "table": {"head": ["Kişi", "Olumlu", "Olumsuz"], "rows": [["én", "vagyok", "nem vagyok"], ["te", "vagy", "nem vagy"], ["ő / ön", "van", "nincs"], ["mi", "vagyunk", "nem vagyunk"], ["ti", "vagytok", "nem vagytok"], ["ők / önök", "vannak", "nincsenek"]]}, "ex": [["Én itt vagyok. Te nem vagy itt.", "Ben buradayım. Sen burada değilsin."], ["Én Umut vagyok. Te Erdem vagy.", "Ben Umut'um. Sen Erdem'sin."], ["Mi törökök vagyunk, ti magyarok vagytok.", "Biz Türk'üz, siz Macarsınız."], ["Én tanár vagyok, te tanuló vagy.", "Ben öğretmenim, sen öğrencisin."], ["Ők nincsenek itt.", "Onlar burada değil."]], "vocab": [["ember", "insan"], ["nő", "kadın"], ["férfi", "erkek"], ["tanár", "öğretmen"], ["tanuló", "öğrenci"], ["dolgozó", "çalışan"], ["német", "Alman"], ["török", "Türk"], ["magyar", "Macar"], ["itt", "burada"], ["ott", "orada"]], "read": ["Bemutatkozás", "Jó napot! Umut vagyok, török vagyok. Ő Erdem, ő is török. Mi most Budapesten vagyunk. Ő Kata, ő a tanárunk. Kata magyar. Ti hol vagytok? Itt vagytok?", "İyi günler! Ben Umut, Türk'üm. Bu Erdem, o da Türk. Biz şimdi Budapeşte'deyiz. Bu Kata, o bizim öğretmenimiz. Kata Macar. Siz neredesiniz? Burada mısınız?"], "quiz": [["Mi itt ___.", ["vagyok", "vagyunk", "vagytok", "vannak"], 1, "mi → vagyunk."], ["'O burada değil' hangisi?", ["Ő nem van itt.", "Ő nincs itt.", "Ő nincsenek itt.", "Ő nem vagy itt."], 1, "3. tekil olumsuz: nincs."], ["Hangisi doğru?", ["Ő tanár van.", "Ő tanár.", "Ő tanár vagy.", "Ő tanárok."], 1, "Kimlikte 3. kişide 'van' düşer."], ["Ti magyarok ___.", ["vagytok", "vagyunk", "vannak", "vagy"], 0, "ti → vagytok."]]}, {"id": 14, "hu": "Jelen idő – rendes és -ik igék", "tr": "Şimdiki zaman: düzenli ve -ik fiiller", "dates": ["2026-01-07", "2026-01-12", "2026-04-29"], "intro": "Mastar eki -ni'dir: ülni → kök 'ül'. Kişi ekleri ünlü uyumuna göre değişir. Bazı fiillerin sözlük biçimi 3. tekilde -ik ile biter (dolgozik, lakik, játszik); bunlar 1. tekilde gündelik dilde -ok/-ek, standart dilde -om/-em alır.", "rules": ["Én: -ok/-ek/-ök · Te: -sz (kök s, sz, z, zs ile bitiyorsa -ol/-el/-öl) · Ő: ek yok · Mi: -unk/-ünk · Ti: -tok/-tek/-tök · Ők: -nak/-nek.", "-ik fiiller: ő dolgozik, ő lakik; én dolgozom / dolgozok.", "Te + s/sz/z bitişli kök: olvasol, főzöl, játszol, teniszezel.", "Ön (siz, resmi) = ő gibi çekilir, önök = ők gibi."], "table": {"head": ["Kişi", "ülni", "lakni", "olvasni", "teniszezni"], "rows": [["én", "ülök", "lakok / lakom", "olvasok", "teniszezek"], ["te", "ülsz", "laksz", "olvasol", "teniszezel"], ["ő/ön", "ül", "lakik", "olvas", "teniszezik"], ["mi", "ülünk", "lakunk", "olvasunk", "teniszezünk"], ["ti", "ültök", "laktok", "olvastok", "teniszeztek"], ["ők/önök", "ülnek", "laknak", "olvasnak", "teniszeznek"]]}, "ex": [["Én a szobában ülök, Erdem pedig a konyhában főz.", "Ben odada oturuyorum, Erdem ise mutfakta yemek yapıyor."], ["Mi magyarul tanulunk, ti pedig törökül tanultok.", "Biz Macarca öğreniyoruz, siz ise Türkçe öğreniyorsunuz."], ["Én minden nap az irodában reggelizek, de otthon vacsorázunk.", "Her gün ofiste kahvaltı yaparım ama evde akşam yemeği yeriz."], ["A kutya a kertben játszik.", "Köpek bahçede oynuyor."], ["Ayse munka után a parkban fut.", "Ayşe işten sonra parkta koşuyor."]], "vocab": [["ülni", "oturmak"], ["állni", "ayakta durmak"], ["tanulni", "öğrenmek"], ["olvasni", "okumak"], ["csinálni", "yapmak"], ["sütni", "fırınlamak, kızartmak"], ["főzni", "yemek pişirmek"], ["dolgozni", "çalışmak"], ["lakni", "ikamet etmek"], ["játszani", "oynamak"], ["futni", "koşmak"], ["munka", "iş"], ["mert", "çünkü"], ["minden nap", "her gün"]], "read": ["Egy átlagos nap", "Én Budapesten lakom és egy irodában dolgozom. Reggel kávét iszom, utána munkába megyek. Erdem otthon dolgozik. Délután a parkban futunk, a kutya pedig a kertben játszik. Este együtt főzünk és olvasunk.", "Ben Budapeşte'de oturuyorum ve bir ofiste çalışıyorum. Sabah kahve içerim, sonra işe giderim. Erdem evde çalışıyor. Öğleden sonra parkta koşarız, köpek ise bahçede oynar. Akşam birlikte yemek yapar ve okuruz."], "quiz": [["Te mit ___ (csinál) este?", ["csinálsz", "csinálol", "csinálok", "csinál"], 0, "te → -sz."], ["Ő minden nap ___ (dolgozik).", ["dolgoz", "dolgozik", "dolgozok", "dolgozsz"], 1, "-ik fiil: ő dolgozik."], ["Te ___ (olvas) könyvet?", ["olvassz", "olvasol", "olvasz", "olvasok"], 1, "s ile biten kök → -ol."], ["Ők a parkban ___ (sétál).", ["sétálnak", "sétálnek", "sétáltok", "sétálunk"], 0, "ők + kalın ünlü → -nak."]]}, {"id": 15, "hu": "Rendhagyó igék", "tr": "Düzensiz fiiller: enni, inni, venni, menni, jönni, aludni…", "dates": ["2026-01-14", "2026-01-26", "2026-03-23", "2026-09-10"], "intro": "Mastarı -nni ile biten kısa fiiller (enni, inni, venni, vinni, hinni, tenni, lenni) ile menni, jönni ve aludni düzensiz çekilir. Derste önce gündelik 'eszek, iszok' biçimlerini, sonra standart 'eszem, iszom' biçimlerini gösterdi; ikisi de duyulur.", "rules": ["venni, hinni, vinni, tenni, lenni aynı kalıpta: veszek, veszel, vesz, veszünk, vesztek, vesznek.", "enni / inni -ik gibidir: ő eszik, ő iszik.", "aludni: alszom, alszol, alszik, alszunk, alszotok, alszanak.", "menni ve jönni: megyek/jövök, mész/jössz, megy/jön, megyünk/jövünk, mentek/jöttök, mennek/jönnek."], "table": {"head": ["Kişi", "enni", "inni", "venni", "menni", "jönni", "aludni"], "rows": [["én", "eszem", "iszom", "veszek", "megyek", "jövök", "alszom"], ["te", "eszel", "iszol", "veszel", "mész", "jössz", "alszol"], ["ő", "eszik", "iszik", "vesz", "megy", "jön", "alszik"], ["mi", "eszünk", "iszunk", "veszünk", "megyünk", "jövünk", "alszunk"], ["ti", "esztek", "isztok", "vesztek", "mentek", "jöttök", "alszotok"], ["ők", "esznek", "isznak", "vesznek", "mennek", "jönnek", "alszanak"]]}, "ex": [["Én ma nem eszem hamburgert, mert nem vagyok jól.", "Bugün hamburger yemiyorum çünkü iyi değilim."], ["Te iszol kávét? – Igen, kérek egy török kávét, cukor nélkül.", "Kahve içer misin? – Evet, şekersiz bir Türk kahvesi rica ederim."], ["Holnap veszek egy új táskát, mert a régi már nem jó.", "Yarın yeni bir çanta alacağım çünkü eskisi artık iyi değil."], ["Viszek egy üveg vizet az irodába.", "Ofise bir şişe su götürüyorum."], ["Ma nem leszünk otthon.", "Bugün evde olmayacağız."]], "vocab": [["enni", "yemek yemek"], ["inni", "içmek"], ["venni", "satın almak"], ["vinni", "götürmek"], ["hinni", "inanmak"], ["tenni", "koymak"], ["lenni", "olmak"], ["menni", "gitmek"], ["jönni", "gelmek"], ["aludni", "uyumak"], ["hozni", "getirmek"], ["sajnos", "maalesef"], ["rossz", "kötü"], ["jó", "iyi"], ["nehéz", "ağır, zor"], ["üveg", "şişe, cam"]], "read": ["Bevásárlás", "Szombaton a boltba megyek. Kenyeret, sajtot és gyümölcsöt veszek. Erdem nem jön velem, mert otthon alszik. Délben hazajövök, és együtt eszünk. Ebéd után kávét iszunk. Este a barátunk jön hozzánk, ő bort hoz.", "Cumartesi markete gidiyorum. Ekmek, peynir ve meyve alıyorum. Erdem benimle gelmiyor çünkü evde uyuyor. Öğlen eve geliyorum ve birlikte yemek yiyoruz. Öğle yemeğinden sonra kahve içiyoruz. Akşam arkadaşımız bize geliyor, o şarap getiriyor."], "quiz": [["Te hova ___ (menni)?", ["mensz", "mész", "megysz", "mégy"], 1, "te → mész."], ["Ők ___ (aludni).", ["aludnak", "alszanak", "alszonak", "alusznak"], 1, "ők → alszanak."], ["Mi ___ (jönni) holnap.", ["jönünk", "jövünk", "jöttünk", "jönnünk"], 1, "mi → jövünk."], ["Ő kávét ___ (inni).", ["iszik", "isz", "iszok", "inik"], 0, "inni -ik gibi: ő iszik."]]}, {"id": 16, "hu": "Tudni, akarni, szeretnék, kérni", "tr": "Yapabilmek, istemek, rica etmek + mastar", "dates": ["2026-01-26", "2026-01-28", "2026-02-09", "2026-02-18"], "intro": "Bu fiillerden sonra ikinci fiil mastar (-ni) halinde gelir: Tudok úszni. Akarok aludni. 'Szeretnék' kibar istek kipidir (isterdim); 'szeretni' ise sevmek demektir. Gitmek fiiliyle amaç da mastarla söylenir: vásárolni megyek (alışverişe gidiyorum).", "rules": ["tudni = bilmek / yapabilmek: Tudok biciklizni. Tudok angolul (İngilizce biliyorum).", "akarni = istemek (doğrudan), szeretnék = isterdim (kibar): Szeretnék inni egy kávét.", "kérni = rica etmek, istemek (sipariş): Kérek egy kávét.", "menni + mastar: Holnap dolgozni megyek. Vásárolni megyünk.", "Olumsuz: nem tudok, nem akarok. Sebep: mert (çünkü), sonuç: ezért (bu yüzden). Tercih: inkább."], "table": {"head": ["Kişi", "tudni", "akarni", "kérni", "szeretnék"], "rows": [["én", "tudok", "akarok", "kérek", "szeretnék"], ["te", "tudsz", "akarsz", "kérsz", "szeretnél"], ["ő/ön", "tud", "akar", "kér", "szeretne"], ["mi", "tudunk", "akarunk", "kérünk", "szeretnénk"], ["ti", "tudtok", "akartok", "kértek", "szeretnétek"], ["ők/önök", "tudnak", "akarnak", "kérnek", "szeretnének"]]}, "ex": [["Én nem tudok aludni világosban.", "Aydınlıkta uyuyamam."], ["Ma nem akarok dolgozni menni, mert beteg vagyok.", "Bugün işe gitmek istemiyorum çünkü hastayım."], ["Szeretnék kérni egy pohár száraz fehér bort.", "Bir kadeh sek beyaz şarap rica etmek isterim."], ["Te tudsz magyarul? – Egy kicsit, de nem elég jól.", "Macarca biliyor musun? – Biraz, ama yeterince iyi değil."], ["Hol szeretnél ebédelni, otthon vagy inkább egy étteremben?", "Nerede öğle yemeği yemek istersin, evde mi yoksa tercihen bir restoranda mı?"]], "vocab": [["tudni", "bilmek, -ebilmek"], ["akarni", "istemek"], ["szeretnék", "isterdim"], ["kérni", "rica etmek"], ["úszni", "yüzmek"], ["biciklizni", "bisiklete binmek"], ["beteg", "hasta"], ["idő", "hava / zaman"], ["ezért", "bu yüzden"], ["inkább", "tercihen"], ["általában", "genellikle"], ["vagy", "veya"], ["újság", "gazete"], ["város", "şehir"], ["sétálni", "dolaşmak"]], "read": ["Szombati terv", "Szombaton szeretnék moziba menni, de Erdem nem akar. Ő inkább sétálni akar a városban. Én nem tudok sokat sétálni, mert fáradt vagyok. Ezért délelőtt sétálunk egy kicsit, délután pedig moziba megyünk. Este otthon akarunk vacsorázni, mert mindketten szeretünk főzni.", "Cumartesi sinemaya gitmek isterdim ama Erdem istemiyor. O tercihen şehirde dolaşmak istiyor. Ben çok yürüyemem çünkü yorgunum. Bu yüzden öğleden önce biraz yürüyoruz, öğleden sonra da sinemaya gidiyoruz. Akşam evde yemek yemek istiyoruz çünkü ikimiz de yemek yapmayı seviyoruz."], "quiz": [["Holnap vásárolni ___.", ["megyek", "menni", "megy", "mentek"], 0, "menni + mastar: vásárolni megyek."], ["'İsterdim' hangisi?", ["akarok", "szeretek", "szeretnék", "kérem"], 2, "szeretnék = kibar istek."], ["Ti ___ (tudni) úszni?", ["tudsz", "tudtok", "tudunk", "tudnak"], 1, "ti → tudtok."], ["'Bu yüzden' hangisi?", ["mert", "ezért", "inkább", "de"], 1, "ezért = bu yüzden."]]}, {"id": 17, "hu": "-val/-vel, -tól/-ig", "tr": "Birliktelik (-la/-le) ve -den … -e kadar", "dates": ["2026-01-21", "2026-01-28", "2026-02-04"], "intro": "-val/-vel 'ile' demektir. Ünsüzle biten kelimede v harfi son ünsüze dönüşür ve ikilenir: könyv → könyvvel, füzet → füzettel, busz → busszal. Zaman/yer aralığı -tól/-től … -ig ile söylenir.", "rules": ["Ünlüyle biten: óra → órával, alma → almával (a → á, e → é).", "Ünsüzle biten: Ali → Alival ama füzet → füzettel, kutyám → kutyámmal, férjem → férjemmel.", "-tól/-től = -den, -ig = -e kadar: reggeltől estig, hétfőtől péntekig, januártól márciusig.", "Resmi 'siz': önnel (sizinle, tekil), önökkel (sizinle, çoğul)."], "table": {"head": ["Kelime", "-val/-vel"], "rows": [["óra", "órával"], ["iskola", "iskolával"], ["Ali", "Alival"], ["könyv", "könyvvel"], ["füzet", "füzettel"], ["busz", "busszal"], ["feleségem", "feleségemmel"]]}, "ex": [["Holnap kávézni megyünk a férjemmel.", "Yarın kocamla kahve içmeye gidiyoruz."], ["Ma este munka után sétálni megyek a kutyámmal.", "Bu akşam iş çıkışı köpeğimle yürüyüşe gidiyorum."], ["Hétfőtől péntekig Mezőberényben vagyok.", "Pazartesiden cumaya kadar Mezőberény'deyim."], ["Ma az irodában leszek reggeltől estig.", "Bugün sabahtan akşama kadar ofiste olacağım."], ["Ma önnel jövök ebédelni.", "Bugün sizinle öğle yemeğine geliyorum."]], "vocab": [["férj", "koca"], ["feleség", "eş (kadın)"], ["barátnő", "kız arkadaş"], ["senki", "kimse"], ["semmi", "hiçbir şey"], ["egyedül", "yalnız"], ["együtt", "birlikte"], ["maradni", "kalmak"], ["utazni", "seyahat etmek"], ["már", "artık"], ["ha", "eğer"], ["fáradt", "yorgun"], ["vasalni", "ütü yapmak"]], "read": ["Egy hét Londonban", "Holnaptól egy hétig nem leszek az irodában, mert a férjemmel Londonba utazunk. Hétfőtől szerdáig a városban sétálunk, szerdától péntekig pedig a barátainkkal leszünk. Busszal és metróval megyünk mindenhová. Péntek este repülővel jövünk haza.", "Yarından itibaren bir hafta ofiste olmayacağım çünkü kocamla Londra'ya gidiyoruz. Pazartesiden çarşambaya kadar şehirde dolaşacağız, çarşambadan cumaya kadar da arkadaşlarımızla olacağız. Her yere otobüs ve metroyla gideceğiz. Cuma akşamı uçakla eve döneceğiz."], "quiz": [["'Kitapla' hangisi?", ["könyvvel", "könyvval", "könyvel", "könyvhez"], 0, "Ünsüz ikilenir: könyv + vel → könyvvel."], ["'Sabahtan akşama kadar'?", ["reggeltől estig", "reggelig estől", "reggelben este", "reggelre estig"], 0, "-tól … -ig."], ["'Otobüsle' hangisi?", ["buszval", "busszal", "buszon", "buszhoz"], 1, "sz ikilenir: busszal."], ["'Senki' ne demek?", ["herkes", "kimse", "hiçbir şey", "yalnız"], 1, "senki = kimse."]]}, {"hu": "Kötőszavak: és, de, pedig, mert, ezért, hanem, is, sem", "tr": "Bağlaçlar ve 'de / da' (is, sem)", "dates": ["2025-11-05", "2026-01-12", "2026-01-14", "2026-01-26", "2026-03-30", "2026-06-17"], "intro": "Bağlaçlar derslerde cümle kurarken sürekli kullanıldı. 'pedig' karşılaştırma yapar (ise), 'hanem' olumsuzdan sonra düzeltme yapar (değil… -dir), 'is' ve 'sem' Türkçedeki 'de/da' gibi kendinden önceki kelimeye bağlanır.", "rules": ["és = ve · de = ama · vagy = veya · pedig = ise · mert = çünkü · ezért = bu yüzden · ha = eğer · akkor = o zaman · mégis = buna rağmen · csak = sadece.", "nem … hanem: A kutya nem a szobában eszik, hanem a kertben.", "is (de/da): Én is tudok magyarul. Neked is?", "sem (olumsuz de/da): Én sem tudok magyarul. (sem/se)", "Ha … akkor: Ha holnap jó idő lesz, akkor biciklizünk."], "table": {"head": ["Macarca", "Türkçe", "Örnek"], "rows": [["és", "ve", "Ali és Ayse"], ["de", "ama", "Kicsi, de szép."], ["pedig", "ise", "Én ülök, Erdem pedig főz."], ["mert", "çünkü", "Nem jövök, mert beteg vagyok."], ["ezért", "bu yüzden", "Fáradt vagyok, ezért itthon maradok."], ["nem … hanem", "değil … -dir", "Nem kávét, hanem teát kérek."], ["is", "de/da", "Én is."], ["sem", "de/da (olumsuz)", "Én sem."], ["ha", "eğer", "Ha van időd …"], ["mégis", "buna rağmen", "Sötét, de mégis barátságos."]]}, "ex": [["Én a szobában ülök, Erdem pedig a konyhában főz.", "Ben odada oturuyorum, Erdem ise mutfakta yemek yapıyor."], ["Ma nem leszünk otthon, mert étteremben vacsorázunk.", "Bugün evde olmayacağız çünkü restoranda yemek yiyeceğiz."], ["Hétvégén Amszterdamba akarunk menni, de rossz az autóm, ezért nem tudunk menni.", "Hafta sonu Amsterdam'a gitmek istiyoruz ama arabam bozuk, bu yüzden gidemiyoruz."], ["Én nem tudok magyarul. – Én sem.", "Ben Macarca bilmiyorum. – Ben de."], ["A lakásunk sötét, de mégis nagyon barátságos.", "Dairemiz karanlık ama buna rağmen çok samimi."]], "vocab": [["és", "ve"], ["de", "ama"], ["pedig", "ise"], ["mert", "çünkü"], ["ezért", "bu yüzden"], ["hanem", "-dir (değil… -dir)"], ["is", "de, da"], ["sem", "de, da (olumsuz)"], ["ha", "eğer"], ["mégis", "buna rağmen"]], "read": ["Nem kávé, hanem tea", "Reggel nem kávét iszom, hanem teát, mert a kávé után fáj a fejem. Erdem pedig mindig kávét iszik. Ma esik az eső, ezért nem megyünk sétálni. Ha holnap jó idő lesz, akkor kirándulunk. Én is szeretnék menni, és Erdem is.", "Sabah kahve değil çay içiyorum çünkü kahveden sonra başım ağrıyor. Erdem ise hep kahve içer. Bugün yağmur yağıyor, bu yüzden yürüyüşe çıkmıyoruz. Yarın hava güzel olursa o zaman geziye gideriz. Ben de gitmek isterim, Erdem de."], "quiz": [["'Ben de bilmiyorum': Én ___ tudom.", ["is nem", "sem", "se is", "pedig"], 1, "Olumsuzda 'sem'."], ["Nem kávét, ___ teát kérek.", ["de", "hanem", "pedig", "mert"], 1, "nem … hanem."], ["Fáradt vagyok, ___ itthon maradok.", ["mert", "ezért", "hanem", "ha"], 1, "Sonuç → ezért."], ["'Ise' hangisi?", ["pedig", "de", "is", "és"], 0, "pedig = ise."]], "id": 18}, {"id": 19, "hu": "Tárgyrag -t és ez / az", "tr": "Belirtme hali (-t) ve işaret sıfatları", "dates": ["2026-03-04", "2026-03-18", "2026-03-23", "2026-09-10"], "intro": "Fiilden etkilenen nesne -t alır (Türkçedeki -i hali). Ünsüzle biten kelimelere çoğu zaman bağlayıcı ünlü girer: könyvet, tollat, polcot. Ez (bu) ve az (şu/o), arkasındaki ismin aldığı eki kendisi de alır: ebben a házban, azzal a tollal.", "rules": ["Ünlüyle biten: alma → almát, autó → autót, reggeli → reggelit.", "Ünsüzle: banán → banánt, asztal → asztalt, ama könyv → könyvet, toll → tollat, polc → polcot.", "Çoğul + nesne: almákat, könyveket, autókat.", "ez + ek → ebben, ebbe, ebből, ezen, ezzel, ennél, erről, erre; az + ek → abban, abba, abból, azon, azzal, annál, arról, arra.", "Belirli nesneyle fiil 'belirli' çekime geçer: Szeretem a citromot. Szereted? Szereti."], "table": {"head": ["Tekil", "-t", "Çoğul", "Çoğul -t"], "rows": [["alma", "almát", "almák", "almákat"], ["könyv", "könyvet", "könyvek", "könyveket"], ["toll", "tollat", "tollak", "tollakat"], ["polc", "polcot", "polcok", "polcokat"], ["asztal", "asztalt", "asztalok", "asztalokat"], ["ez", "ezt", "ezek", "ezeket"], ["az", "azt", "azok", "azokat"]]}, "ex": [["Ezt az asztalt kérem.", "Bu masayı istiyorum."], ["Azokat a fiúkat látom.", "O çocukları görüyorum."], ["Ebben a házban sok szoba van.", "Bu evde çok oda var."], ["Ezzel az autóval megyünk kirándulni.", "Bu arabayla geziye gidiyoruz."], ["Abból az üzletből jövünk.", "O dükkândan geliyoruz."], ["Én szeretek olvasni, ezért öt könyvet veszek.", "Okumayı severim, bu yüzden beş kitap alıyorum."]], "vocab": [["ez / az", "bu / şu, o"], ["ezek / azok", "bunlar / onlar"], ["melyik", "hangi"], ["kulcs", "anahtar"], ["üzlet", "dükkân"], ["bolt", "market"], ["kirándulni", "gezmeye gitmek"], ["tele", "dolu"], ["elég", "yeterli"], ["látni", "görmek"], ["citrom", "limon"], ["toll", "kalem"]], "read": ["A boltban", "– Jó napot! Ezt a kenyeret és azokat az almákat kérem. – Melyik almákat? Ezeket? – Nem, azokat a pirosakat. – Tessék. – Köszönöm. Ebben a boltban mindig friss a kenyér. Holnap is ebből a boltból veszek tejet.", "– İyi günler! Bu ekmeği ve şu elmaları istiyorum. – Hangi elmaları? Bunları mı? – Hayır, şu kırmızıları. – Buyurun. – Teşekkürler. Bu markette ekmek hep taze. Yarın da bu marketten süt alacağım."], "quiz": [["Kérek egy ___ (toll).", ["tollt", "tollat", "tollot", "tollet"], 1, "toll → tollat."], ["'Bu evde' hangisi?", ["ez a házban", "ebben a házban", "ezben a házban", "ebbe a házban"], 1, "ez + ben → ebben."], ["Azzal a ___ írok.", ["toll", "tollal", "tollat", "tollban"], 1, "İsim de -val/-vel alır: tollal."], ["'Könyv' kelimesinin nesne hali?", ["könyvt", "könyvet", "könyvot", "könyvát"], 1, "könyv → könyvet."]]}, {"hu": "Határozott ragozás és engem, téged", "tr": "Belirli nesne çekimi ve nesne zamirleri", "dates": ["2026-03-23", "2026-04-27", "2026-03-04"], "intro": "Macarcada fiil, nesnesi belirli olduğunda (a/az ile, özel isim, ez/az, iyelikli isim) farklı çekilir: Látok egy házat (bir ev görüyorum) – Látom a házat (evi görüyorum). Derste bu, 'szeretek / szeretem' çiftiyle gösterildi.", "rules": ["Belirsiz: Szeretek olvasni. Kérek egy kávét. Látok egy fiút.", "Belirli: Szeretem a citromot. Kérem a könyvet. Látom azt a fiút.", "Belirli ekler: -om/-em/-öm, -od/-ed/-öd, -ja/-i, -juk/-jük, -játok/-itek, -ják/-ik.", "Nesne zamirleri: engem (beni), téged (seni), őt (onu), minket (bizi), titeket (sizi), őket (onları).", "engem, téged, minket, titeket ile belirsiz çekim: Lát engem. 'Seni seviyorum' = szeretlek (özel -lak/-lek)."], "table": {"head": ["Kişi", "Belirsiz (szeret)", "Belirli (szeret)", "Belirli (olvas)"], "rows": [["én", "szeretek", "szeretem", "olvasom"], ["te", "szeretsz", "szereted", "olvasod"], ["ő", "szeret", "szereti", "olvassa"], ["mi", "szeretünk", "szeretjük", "olvassuk"], ["ti", "szerettek", "szeretitek", "olvassátok"], ["ők", "szeretnek", "szeretik", "olvassák"]]}, "ex": [["Szeretem a citromot. Szereti a citromot.", "Limonu seviyorum. Limonu seviyor."], ["Kérek egy könyvet. – Kérem a könyvet.", "Bir kitap istiyorum. – Kitabı istiyorum."], ["Azt a fiút látom.", "O çocuğu görüyorum."], ["Én szeretlek téged.", "Ben seni seviyorum."], ["Kovács tanárnő tanít minket.", "Kovács öğretmen bize ders veriyor (bizi öğretiyor)."]], "vocab": [["látni", "görmek"], ["ismerni", "tanımak"], ["érteni", "anlamak"], ["tanítani", "öğretmek"], ["engem / téged", "beni / seni"], ["minket / titeket", "bizi / sizi"]], "read": ["Ismered?", "– Ismered azt a nőt? – Igen, ismerem. Ő a szomszédunk, Kati. – És a kutyáját is ismered? – Persze! Minden reggel látom a parkban. Kati nagyon kedves, és engem is mindig megkérdez, hogy vagyok.", "– O kadını tanıyor musun? – Evet, tanıyorum. O bizim komşumuz Kati. – Köpeğini de tanıyor musun? – Tabii! Her sabah parkta görüyorum. Kati çok nazik ve beni de hep nasıl olduğumu soruyor."], "quiz": [["Limonu seviyorum: ___ a citromot.", ["Szeretek", "Szeretem", "Szeretnék", "Szeret"], 1, "Belirli nesne → szeretem."], ["Bir kahve istiyorum: ___ egy kávét.", ["Kérem", "Kérek", "Kéri", "Kérik"], 1, "Belirsiz nesne (egy) → kérek."], ["'Seni seviyorum' hangisi?", ["Szeretem téged", "Szeretlek", "Szeretek téged", "Szereted"], 1, "Özel biçim: szeretlek."], ["'Bizi' hangisi?", ["minket", "titeket", "őket", "engem"], 0, "minket = bizi."]], "id": 20}, {"hu": "-nál/-nél, -hoz/-hez/-höz, -tól/-től", "tr": "Yanında / yanına / yanından (kişilere ve yerlere)", "dates": ["2026-07-02", "2026-07-06", "2026-07-08", "2026-01-28"], "intro": "B
